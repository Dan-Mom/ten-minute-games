<!doctype html>
<html lang="en">
<head><script>/* Ten-Minute Games accounts: a parent signs in with Google, adds children by nickname, and each child's game progress follows them
   to any computer or iPad. Signing in is optional; without it every game works exactly as before (progress stays on this device).

   How progress is kept: every game already saves its progress in this browser (localStorage) under its own names. This script,
   which build.cjs puts at the very top of every page, keeps one copy of those values per player ("guest" = not signed in, or a
   child). When the player changes, the values in the browser are swapped before the game reads them. When a child is playing,
   their copy is also saved to Firebase (Firestore: families/<parent uid>/kids/<child id>), and loaded back on other devices.
   Only values written by these game pages are kept; nothing else in the browser is read or sent.

   Public Firebase web config: allowed on the public site by PRIVACY-RULE.md exception five. Access is guarded by the Firestore
   rules (each parent can only read and write their own family), not by hiding this. */
(function () {
  'use strict';
  if (window.TMG) return;
  var CONFIG = {
    apiKey: 'AIzaSyDC-kbJIExCfhIsUkkShVIO8VtBTe3D7WI',
    authDomain: 'ten-minute-games.firebaseapp.com',
    projectId: 'ten-minute-games',
    storageBucket: 'ten-minute-games.firebasestorage.app',
    messagingSenderId: '448551703283',
    appId: '1:448551703283:web:7f0c2b75a166f1fcbb1d86'
  };
  var SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
  var P = 'tmg.', GUEST = 'guest', MAX_VALUE = 200000;
  var LS; try { LS = window.localStorage; LS.getItem(P + 'x'); } catch (e) { LS = null; }
  if (!LS) { window.TMG = { kid: GUEST, ready: Promise.resolve(), mountHome: function () {} }; return; }
  var rawSet = Storage.prototype.setItem, rawRemove = Storage.prototype.removeItem, rawGet = Storage.prototype.getItem;
  function get(k) { return rawGet.call(LS, k); }
  function put(k, v) { try { rawSet.call(LS, k, v); } catch (e) {} }
  function del(k) { rawRemove.call(LS, k); }
  function J(k, d) { try { var v = get(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function W(k, o) { put(k, JSON.stringify(o)); }
  function ours(k) { return typeof k === 'string' && (k.indexOf(P) === 0 || k.indexOf('firebase') === 0); }

  function current() { return get(P + 'current') || GUEST; }
  function store(id) { return J(P + 'kid.' + id, { data: {}, updated: 0 }); }
  function saveStore(id, s) { W(P + 'kid.' + id, s); }
  function known() { return J(P + 'known', []); }

  /* Put player `id`'s values into the browser. The values sitting there now belong to `owner`: keep them first. */
  function swap() {
    var id = current(), owner = get(P + 'owner') || GUEST;
    if (owner === id) return false;
    var ks = known(), from = store(owner), to = store(id), changed = false;
    ks.forEach(function (k) { var v = get(k); if (v === null) delete from.data[k]; else from.data[k] = v; });
    saveStore(owner, from);
    ks.forEach(function (k) {
      var want = Object.prototype.hasOwnProperty.call(to.data, k) ? to.data[k] : null;
      if (get(k) !== want) { changed = true; if (want === null) del(k); else put(k, want); }
    });
    put(P + 'owner', id);
    return changed;
  }
  swap();

  /* Every write a game makes is copied into the current player's store. For a child, the name is also listed under `changed` until it has reached the cloud.
     Until this page has heard from the cloud, writes only wait: a game saving as it opens must not make an out-of-date device look newest. */
  var dirtyTimer = 0, syncing = false, waiting = {}, onHome = !!document.querySelector('meta[name="tmg-home"]');
  if (get(P + 'dirty') === '1') {          // left by an older version of this script: everything this child has here may be unsent
    if (current() !== GUEST) { var old = store(current()); old.changed = {}; Object.keys(old.data).forEach(function (k) { old.changed[k] = 1; }); saveStore(current(), old); }
    del(P + 'dirty');
  }
  function later() { clearTimeout(dirtyTimer); dirtyTimer = setTimeout(function () { cloud.push(); }, 3000); }
  function noteWrite(k, v) {
    if (ours(k)) return;
    if (v !== null && String(v).length > MAX_VALUE) return;
    var ks = known(); if (ks.indexOf(k) < 0) { ks.push(k); W(P + 'known', ks); }
    var id = current(), s = store(id), had = Object.prototype.hasOwnProperty.call(s.data, k) ? s.data[k] : null;
    if (had === (v === null ? null : String(v))) return;   // nothing new
    if (v === null) delete s.data[k]; else s.data[k] = String(v);
    if (id === GUEST) { s.updated = Date.now(); saveStore(id, s); return; }
    if (syncing) { waiting[k] = 1; saveStore(id, s); return; }
    (s.changed = s.changed || {})[k] = 1; s.updated = Date.now(); saveStore(id, s);
    later();
  }
  Storage.prototype.setItem = function (k, v) { rawSet.call(this, k, v); if (this === LS) noteWrite(String(k), String(v)); };
  Storage.prototype.removeItem = function (k) { rawRemove.call(this, k); if (this === LS) noteWrite(String(k), null); };
  /* the writes that were waiting now count as this child's changes */
  function settle() {
    syncing = false;
    var ks = Object.keys(waiting), id = current(); waiting = {};
    if (!ks.length || id === GUEST) return;
    var s = store(id); s.changed = s.changed || {};
    ks.forEach(function (k) { s.changed[k] = 1; });
    s.updated = Date.now(); saveStore(id, s); later();
  }
  function reloadPage() {
    try {
      var flag = 'tmg.reloaded.' + location.pathname, last = Number(sessionStorage.getItem(flag)) || 0;
      if (Date.now() - last > 30000) { sessionStorage.setItem(flag, String(Date.now())); location.reload(); }
    } catch (e) {}
  }
  /* A child's copies on this device: progress and the reward words. */
  function dropKid(id) {
    del(P + 'kid.' + id);
    var end = '.rewards.' + id;
    Object.keys(LS).forEach(function (k) { if (k.indexOf(P) === 0 && k.slice(-end.length) === end) del(k); });
  }
  /* The child was removed on another device: this device lets go too, and never writes them back. */
  function childGone(id) {
    if (current() === id) { put(P + 'current', GUEST); swap(); }
    dropKid(id);
    var fam = J(P + 'family', null);
    if (fam && fam.kids) { fam.kids = fam.kids.filter(function (k) { return k.id !== id; }); W(P + 'family', fam); }
  }

  /* ---------- Firebase (loaded only when it is needed) ---------- */
  var fb = null;
  function loadScript(src) { return new Promise(function (ok, no) { var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }
  function firebaseReady() {
    if (fb) return fb;
    fb = loadScript(SDK + 'firebase-app-compat.js')
      .then(function () { return Promise.all([loadScript(SDK + 'firebase-auth-compat.js'), loadScript(SDK + 'firebase-firestore-compat.js')]); })
      .then(function () {
        var app = window.firebase.apps.length ? window.firebase.app() : window.firebase.initializeApp(CONFIG);
        return { auth: app.auth(), db: app.firestore() };
      });
    return fb;
  }
  function userNow(f) { return new Promise(function (ok) { var off = f.auth.onAuthStateChanged(function (u) { off(); ok(u); }); }); }
  function kidsRef(f, uid) { return f.db.collection('families').doc(uid).collection('kids'); }

  var cloud = {
    /* upload a child's copy if it has changes. true = nothing is left unsent. `update`, not `set`: it fails on a child who has been removed instead of bringing them back. */
    push: function (id) {
      id = id || current();
      var uid = get(P + 'uid');
      if (id === GUEST || !uid) return Promise.resolve(true);
      if (syncing && id === current()) return ready.then(function () { return cloud.push(id); });
      var s = store(id);
      if (!Object.keys(s.changed || {}).length) return Promise.resolve(true);
      var name = (J(P + 'family', { kids: [] }).kids.filter(function (k) { return k.id === id; })[0] || {}).name || 'Player';
      if (JSON.stringify(s.data).length > 900000) return Promise.resolve(false);   // a Firestore document holds at most 1 MB: keep it on this device only
      return firebaseReady().then(function (f) {
        return kidsRef(f, uid).doc(id).update({ name: name, data: s.data, updated: s.updated || Date.now() });
      }).then(function () {
        var now = store(id);
        now.base = s.updated;   // the cloud now holds this version
        if (now.updated === s.updated) now.changed = {};
        saveStore(id, now);
        return true;
      }, function (e) {
        if (e && e.code === 'not-found') { childGone(id); if (!onHome) reloadPage(); return true; }
        return false;
      });
    },
    /* compare with the cloud; returns true when the values in the browser changed */
    pull: function () {
      var id = current(), uid = get(P + 'uid');
      if (id === GUEST || !uid) return Promise.resolve(false);
      return firebaseReady().then(function (f) { return kidsRef(f, uid).doc(id).get(); }).then(function (doc) {
        if (!doc.exists) { childGone(id); return true; }
        var c = doc.data(), s = store(id), cu = c.updated || 0, mine = s.changed || {};
        var news = s.base != null ? cu !== s.base : cu > (s.updated || 0);   // has the cloud changed since this device last synced?
        if (!news) {
          if (cu < (s.updated || 0) && !Object.keys(mine).length) { s.changed = {}; Object.keys(s.data).forEach(function (k) { s.changed[k] = 1; }); saveStore(id, s); }
          return false;
        }
        /* the cloud is newer: take it, keeping only what this device changed and has not sent yet */
        var data = JSON.parse(JSON.stringify(c.data || {})), mineKeys = Object.keys(mine);
        mineKeys.forEach(function (k) { if (Object.prototype.hasOwnProperty.call(s.data, k)) data[k] = s.data[k]; else delete data[k]; });
        saveStore(id, { data: data, updated: mineKeys.length ? Math.max(Date.now(), cu + 1) : cu, changed: mine, base: cu });
        waiting = {};
        var ks = known(); Object.keys(data).forEach(function (k) { if (ks.indexOf(k) < 0) ks.push(k); }); W(P + 'known', ks);
        var changed = false;
        if ((get(P + 'owner') || GUEST) === id) ks.forEach(function (k) {
          var want = Object.prototype.hasOwnProperty.call(data, k) ? data[k] : null;
          if (get(k) !== want) { changed = true; if (want === null) del(k); else put(k, want); }
        });
        return changed;
      }, function () { return false; });
    }
  };
  /* hear from the cloud, then send whatever is left to send */
  function syncNow() {
    syncing = true;
    setTimeout(function () { if (syncing) settle(); }, 20000);   // no answer for this long: what the child has been doing counts
    return cloud.pull().then(function (changed) { settle(); cloud.push(); return changed; });
  }
  window.addEventListener('pagehide', function () { cloud.push(); });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') cloud.push(); });

  /* On a game page with a child playing: fetch their newest progress; if it differs from what the game already read, reload. */
  var ready = Promise.resolve();
  if (get(P + 'uid') && current() !== GUEST) {
    ready = syncNow().then(function (changed) { if (changed && !onHome) reloadPage(); });
  }

  /* ---------- the parent panel on the home page ---------- */
  function E(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function newId() { var a = new Uint8Array(9); crypto.getRandomValues(a); return Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join(''); }
  function cleanName(s) { return String(s || '').replace(/[<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, 20); }

  function mountHome(box) {
    var msg = '';
    function render() {
      box.replaceChildren();
      var uid = get(P + 'uid'), fam = J(P + 'family', { kids: [] }), cur = current();
      if (!uid) {
        var b = E('button', 'acct-btn', 'Parent sign-in'); b.type = 'button'; b.onclick = signIn;
        box.appendChild(b);
        box.appendChild(E('span', 'acct-note', 'Optional: keep each child’s progress on every device.'));
      } else {
        var row = E('div', 'acct-kids');
        fam.kids.forEach(function (k) {
          var chip = E('button', 'acct-kid' + (k.id === cur ? ' on' : ''), (k.id === cur ? '▶ ' : '') + k.name); chip.type = 'button';
          chip.setAttribute('aria-pressed', k.id === cur ? 'true' : 'false');
          chip.onclick = function () { choose(k.id); };
          row.appendChild(chip);
        });
        var g = E('button', 'acct-kid' + (cur === GUEST ? ' on' : ''), 'Just looking'); g.type = 'button'; g.onclick = function () { choose(GUEST); };
        row.appendChild(g);
        var add = E('button', 'acct-btn small', '+ Add child'); add.type = 'button'; add.onclick = addKid;
        row.appendChild(add);
        box.appendChild(row);
        var tools = E('span', 'acct-tools');   // on the same row, right after "+ Add child"
        var so = E('button', 'acct-link', 'Sign out'); so.type = 'button'; so.onclick = signOut; tools.appendChild(so);
        var rm = E('button', 'acct-link', 'Remove a child'); rm.type = 'button'; rm.onclick = removeKid; tools.appendChild(rm);
        var dl = E('button', 'acct-link danger', 'Delete account and all data'); dl.type = 'button'; dl.onclick = deleteAll; tools.appendChild(dl);
        var pv = E('a', 'acct-link', 'Privacy'); pv.href = 'privacy.html'; tools.appendChild(pv);
        row.appendChild(tools);
      }
      if (msg) box.appendChild(E('div', 'acct-msg', msg));
    }
    function say(t) { msg = t; render(); }
    function loadFamily(f, uid) {
      return kidsRef(f, uid).get().then(function (q) {
        var kids = []; q.forEach(function (d) { kids.push({ id: d.id, name: cleanName(d.data().name) || 'Player' }); });
        kids.sort(function (a, b) { return a.name.localeCompare(b.name); });
        var before = J(P + 'family', { kids: [] }).kids;
        W(P + 'family', { kids: kids });
        if (current() !== GUEST && !kids.some(function (k) { return k.id === current(); })) { put(P + 'current', GUEST); swap(); }
        before.forEach(function (o) { if (!kids.some(function (k) { return k.id === o.id; })) dropKid(o.id); });
        return kids;
      });
    }
    function signIn() {
      say('Opening Google sign-in…');
      firebaseReady().then(function (f) {
        var p = new window.firebase.auth.GoogleAuthProvider();
        return f.auth.signInWithPopup(p).then(function (r) { put(P + 'uid', r.user.uid); return loadFamily(f, r.user.uid); });
      }).then(function (kids) { msg = kids.length ? 'Signed in. Pick who is playing.' : 'Signed in. Add your first child (a nickname is enough).'; render(); },
        function (e) { say(e && e.code === 'auth/popup-closed-by-user' ? '' : 'Sign-in did not work' + (e && e.code ? ' (' + e.code + ')' : '') + '. Please try again.'); });
    }
    function addKid() {
      var name = cleanName(window.prompt('Child’s nickname (not their full name):', ''));
      if (!name) return;
      var uid = get(P + 'uid'), id = newId(), fam = J(P + 'family', { kids: [] });
      var guest = store(GUEST), first = fam.kids.length === 0 && Object.keys(guest.data).length > 0;
      var start = { data: {}, updated: Date.now() };
      if (first && window.confirm('Move the progress already on this device to ' + name + '?')) {
        swap(); start = { data: JSON.parse(JSON.stringify(store(GUEST).data)), updated: Date.now() };
      }
      say('Adding ' + name + '…');
      firebaseReady().then(function (f) {
        return kidsRef(f, uid).doc(id).set({ name: name, data: start.data, updated: start.updated }).then(function () { return loadFamily(f, uid); });
      }).then(function () { start.base = start.updated; saveStore(id, start); choose(id); }, function () { say('Could not add ' + name + '. Please try again.'); });
    }
    function choose(id) {
      cloud.push().then(function () {
        put(P + 'current', id); swap();
        msg = id === GUEST ? 'Just looking: progress stays on this device.' : 'Now playing: ' + ((J(P + 'family', { kids: [] }).kids.filter(function (k) { return k.id === id; })[0] || {}).name || '');
        render();
        if (id !== GUEST) ready = syncNow();
      });
    }
    function removeKid() {
      var fam = J(P + 'family', { kids: [] }); if (!fam.kids.length) return;
      var name = window.prompt('Type the nickname of the child to remove. Their progress is deleted everywhere.\n\n' + fam.kids.map(function (k) { return k.name; }).join(', '), '');
      var k = fam.kids.filter(function (x) { return x.name === cleanName(name); })[0]; if (!k) return;
      var uid = get(P + 'uid');
      firebaseReady().then(function (f) { return kidsRef(f, uid).doc(k.id).delete().then(function () { return loadFamily(f, uid); }); })
        .then(function () { dropKid(k.id); say(k.name + ' was removed.'); }, function () { say('Could not remove ' + k.name + '. Please try again.'); });
    }
    /* leave this device as a guest device: the children's copies are taken off it. keepUnsent keeps any copy that has not reached the cloud yet. */
    function forgetDevice(keepUnsent) {
      put(P + 'current', GUEST); swap();
      J(P + 'family', { kids: [] }).kids.forEach(function (k) {
        if (keepUnsent && Object.keys(store(k.id).changed || {}).length) return;
        del(P + 'kid.' + k.id);
      });
      if (!keepUnsent) del(P + 'family');
      del(P + 'uid');
    }
    /* never sign out while something has not reached the cloud: signing out takes the only copy off this device */
    function signOut() {
      var ids = J(P + 'family', { kids: [] }).kids.map(function (k) { return k.id; });
      say('Saving…');
      ready.then(function () { return Promise.all(ids.map(function (id) { return cloud.push(id); })); }).then(function (done) {
        if (done.indexOf(false) >= 0) { say('Not signed out: some progress has not been saved yet. Check the internet and try again.'); return; }
        return firebaseReady().then(function (f) { return f.auth.signOut(); }).then(function () { forgetDevice(); say('Signed out. This device is back to guest play.'); },
          function () { forgetDevice(); say('Signed out on this device.'); });
      });
    }
    function deleteAll() {
      if (!window.confirm('Delete your account, all your children and all their progress? This cannot be undone.')) return;
      var uid = get(P + 'uid');
      say('Deleting…');
      firebaseReady().then(function (f) {
        return kidsRef(f, uid).get().then(function (q) { var jobs = []; q.forEach(function (d) { jobs.push(d.ref.delete()); }); return Promise.all(jobs); })
          .then(function () { var u = f.auth.currentUser; return u.delete().catch(function (e) {
            if (e && e.code === 'auth/requires-recent-login') return u.reauthenticateWithPopup(new window.firebase.auth.GoogleAuthProvider()).then(function () { return u.delete(); });
            throw e; }); });
      }).then(function () { var ids = J(P + 'family', { kids: [] }).kids.map(function (k) { return k.id; }); forgetDevice(); ids.forEach(dropKid); say('Your account and all its data were deleted.'); },
        function () { say('Could not finish deleting. Please sign in again and retry.'); });
    }
    /* check the sign-in is still valid (it can end on another device) */
    if (get(P + 'uid')) firebaseReady().then(function (f) { return userNow(f).then(function (u) {
      if (!u) { forgetDevice(true); render(); return; }
      return loadFamily(f, u.uid).then(render);
    }); }, function () {});
    render();
  }

  window.TMG = { kid: current(), ready: ready, mountHome: mountHome, _swap: swap, _cloud: cloud };
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mail to Grandpa · 寄信给爷爷</title>
<meta name="theme-color" content="#1b6fd1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Chinese game 1. One idea: the 15 new characters of the lesson.
   Level 1 meets and recognises them, level 2 builds words with them, level 3 practises the lesson's sentence pattern, level 4 uses whole words in sentences, level 5 finds them by ear on a bingo card. About ten minutes a level.
   All sentences and the story here are our own; only the characters and common words come from the lesson. */
:root{
  color-scheme:light;
  --ink:#1d2b4f; --mute:#4a587a; --page:#eef6ff; --card:#fff;
  --blue:#1b6fd1; --blue-s:#d5e9ff; --red:#d6246e; --red-s:#ffd8ea; --green:#1f8f45; --green-s:#d3f4dd; --gold:#ffd23f;
  --display:"Baloo 2","Nunito","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,sans-serif;
  --han:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--page);color:var(--ink);font:700 18px/1.5 var(--body);display:flex;flex-direction:column}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15}
.han{font-family:var(--han);font-weight:700}
.wrap{width:100%;max-width:760px;margin:0 auto;padding:16px}
button{font:inherit;cursor:pointer}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-bottom:3px solid var(--blue-s)}
.top h1{font-size:22px;flex:1}
.stamps{font:800 18px var(--display);background:var(--blue-s);color:var(--blue);border-radius:999px;padding:4px 14px;white-space:nowrap}
.btn{min-height:52px;border:0;border-radius:16px;padding:8px 22px;font:800 20px var(--display);background:var(--blue);color:#fff;box-shadow:0 5px 0 #0f4d97}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0f4d97}
.btn.ghost{background:#fff;color:var(--blue);box-shadow:0 5px 0 var(--blue-s)}
.speak{border:0;background:var(--blue-s);color:var(--blue);border-radius:999px;min-width:48px;min-height:48px;font-size:22px}

/* level menu */
.hero{text-align:center;padding:18px 0 6px}
.hero .big{font-size:64px;line-height:1}
.hero p{margin:8px auto 0;color:var(--mute);max-width:560px}
.levels{display:grid;gap:14px;margin-top:18px}
.lv{display:flex;align-items:center;gap:14px;text-align:left;border:3px solid var(--blue-s);background:#fff;border-radius:22px;padding:14px 16px;box-shadow:0 6px 0 var(--blue-s)}
.lv .n{flex:0 0 auto;width:56px;height:56px;border-radius:16px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font:800 26px var(--display)}
.lv.done .n{background:var(--green)}
.lv h3{font-size:21px}
.lv p{margin:2px 0 0;color:var(--mute);font-size:16px}
.lv .go{margin-left:auto;font-size:28px}

/* play */
.bar{height:12px;background:#fff;border-radius:999px;overflow:hidden;box-shadow:inset 0 0 0 2px var(--blue-s);margin:6px 0 14px}
.bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .3s}
.panel{background:#fff;border-radius:26px;padding:20px;box-shadow:0 8px 0 var(--blue-s);text-align:center}
.say{color:var(--mute);font-size:17px;margin:0 0 10px}
.card-big{font-size:110px;line-height:1.1}
.py{font:800 30px var(--display);color:var(--blue)}
.mean{font-size:20px;color:var(--mute)}
.word{font-size:64px;letter-spacing:6px}

save.stamps = save.stamps || 0; save.done = save.done || {};
if (!save.v) {   // a sentence-pattern level was added as level 3, so levels 3 and 4 moved up one
  var moved = {}; Object.keys(save.done).forEach(function (k) { moved[+k >= 3 ? +k + 1 : k] = save.done[k]; }); save.done = moved; save.v = 2; store();
}

/* voice: every character, word and sentence is recorded in advance with a warm voice (mail-voice/<key>.mp3, made by
   网站\make-voices.py; key = the same hash as voice-lines.cjs). Only text with no recording uses the device's own Chinese voice. */
var zh = null, VKEYS = null, player = null;
try { fetch('mail-voice/keys.json').then(function (r) { return r.json(); }).then(function (k) { VKEYS = {}; k.forEach(function (x) { VKEYS[x] = 1; }); }, function () {}); } catch (e) {}
function vkey(t) { t = String(t).replace(/＿/g, '').trim(); var h = 0x811c9dc5; for (var i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return ('0000000' + h.toString(16)).slice(-8); }
function findVoice() {
  try {
    var v = speechSynthesis.getVoices().filter(function (x) { return /^zh/i.test(x.lang) && !/TW|HK/i.test(x.lang); });
    var score = function (x) { return (/natural|neural|enhanced|premium/i.test(x.name) ? 4 : 0) + (/xiaoxiao|tingting|ting-ting|yaoyao|huihui|lili/i.test(x.name) ? 2 : 0); };
    zh = v.sort(function (a, b) { return score(b) - score(a); })[0] || null;

}

}

  var k = vkey(t);

    player.src = 'mail-voice/' + k + '.mp3';

function speakBtn(t) { var b = E('button', 'speak', '🔊'); b.type = 'button'; b.setAttribute('aria-label', 'Listen'); b.onclick = function () { say(t); }; return b; }

  else x.parts.forEach(function (q, n) {
    if (n) pr.appendChild(E('span', 'plus', '+'));

    o.frequency.value = ok ? 880 : 220; g.gain.setValueAtTime(0.12, ac.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + (ok ? 0.25 : 0.35)); o.start(); o.stop(ac.currentTime + 0.4); } catch (e) { /* no sound */ }
}

/* ---------- the level menu ---------- */
var LEVELS = [
  { n: 1, title: 'Meet the characters', zh: '认生字', text: 'Meet 15 new characters, then find each one in the mailbag.', build: level1 },
  { n: 2, title: 'Build the words', zh: '组词', text: 'Each word is missing one character. Pick the right envelope.', build: level2 },
  { n: 3, title: 'Sentence pattern', zh: '句型 是不是', text: 'Learn to check with a 是不是 question: pick the right one, then build your own from word tiles.', build: levelPattern },
  { n: 4, letter: true, title: 'Write the letter', zh: '写信', text: 'Finish our letter to Grandpa: pick the missing word in each sentence, then send it.', build: level3 },
  { n: 5, title: 'Mail Bingo', zh: '邮票 Bingo', text: 'Listen, then stamp what you hear on your card. Make a line, then two lines, then fill the card.', run: bingo }
];
function menu() {

    b.appendChild(E('span', 'n', save.done[L.n] ? '✓' : String(L.n)));
    var t = E('div'); t.appendChild(E('h3', null, 'Level ' + L.n + ': ' + L.title + ' <span class="han">' + L.zh + '</span>')); t.appendChild(E('p', null, L.text)); b.appendChild(t);
    b.appendChild(E('span', 'go', '▶'));

/* ---------- one engine for every level: a queue of steps ---------- */
function play(L) {
  var steps = L.build(), total = steps.length, i = 0, again = {};
  function next() {
    if (i >= steps.length) return finish(L);
    var s = steps[i++];
    app.innerHTML = '';
    var bar = E('div', 'bar'); var fill = E('i'); bar.appendChild(fill); app.appendChild(bar);
    fill.style.width = Math.min(100, Math.round((i - 1) / total * 100)) + '%';
    var p = E('div', 'panel'); app.appendChild(p);
    if (s.type === 'meet') return meet(p, s);
    if (s.type === 'show') return show(p, s);
    if (s.type === 'build') return build(p, s);
    ask(p, s);
  }
  function meet(p, s) {
    p.appendChild(E('p', 'say', 'New character'));
    p.appendChild(E('div', 'card-big han', s.c.c));
    p.appendChild(E('div', 'py', s.c.py));
    p.appendChild(E('div', 'mean', s.c.e + ' ' + s.c.en));
    var part = PARTS.filter(function (x) { return x.c === s.c.c; })[0];
    if (part) p.appendChild(built(part));
    var r = E('div', 'row'); r.appendChild(speakBtn(s.c.c));
    var go = E('button', 'btn', 'Got it ▶'); go.type = 'button'; go.onclick = next; r.appendChild(go); p.appendChild(r);
    say(s.c.c);
  }
  function mark(t) { var P = PATTERN[0]; P.keys.forEach(function (k) { t = t.replace(k, '<span class="key">' + k + '</span>'); }); return t; }
  function show(p, s) {   // the pattern, what it is for, and three examples to hear
    var P = PATTERN[0];
    p.appendChild(E('p', 'say', 'New sentence pattern <span class="han">句型</span>'));
    p.appendChild(E('div', 'pat', mark(P.shape)));
    p.appendChild(E('div', 'mean', P.what));
    var ex = E('div', 'exs');
    P.ex.forEach(function (x) { var r = E('div', 'ex'); r.appendChild(speakBtn(x.s)); var t = E('div'); t.appendChild(E('div', 'han', mark(x.s))); t.appendChild(E('div', 'mean', x.en)); r.appendChild(t); ex.appendChild(r); });
    p.appendChild(ex);
    var r = E('div', 'row'); var go = E('button', 'btn', 'Got it ▶'); go.type = 'button'; go.onclick = next; r.appendChild(go); p.appendChild(r);
    say(P.ex[0].s);
  }
  function build(p, s) {   // tap the word tiles in order; tap a placed tile to take it back
    var P = PATTERN[0], x = s.x, picked = [], wrong = 0, done = false, order;
    do { order = shuffle(x.tiles.map(function (t, i) { return i; })); } while (x.ok.indexOf(order.map(function (i) { return x.tiles[i]; }).join('') + P.end) >= 0);
    p.appendChild(E('p', 'say', 'Tap the words in the right order.'));
    var top = E('div', 'row'); top.appendChild(speakBtn(x.ok[0])); top.appendChild(E('div', 'mean', x.en)); p.appendChild(top);
    var line = E('div', 'bline'), pool = E('div', 'tiles'), fb = E('div', 'fb');
    p.appendChild(line); p.appendChild(pool); p.appendChild(fb);
    function tile(i) { var b = E('button', 'tile' + (P.keys.indexOf(x.tiles[i]) >= 0 ? ' key' : ''), x.tiles[i]); b.type = 'button'; return b; }
    function draw() {
      line.innerHTML = ''; pool.innerHTML = '';
      picked.forEach(function (i, n) { var b = tile(i); b.onclick = function () { if (done) return; picked.splice(n, 1); line.classList.remove('no'); draw(); }; line.appendChild(b); });
      line.appendChild(E('span', 'endmark', P.end));
      order.forEach(function (i) { if (picked.indexOf(i) >= 0) return; var b = tile(i); b.onclick = function () { if (done) return; picked.push(i); draw(); check(); }; pool.appendChild(b); });
    }
    function check() {
      if (picked.length < x.tiles.length) return;
      var said = picked.map(function (i) { return x.tiles[i]; }).join('') + P.end;
      if (x.ok.indexOf(said) >= 0) {
        done = true; line.classList.add('ok'); beep(true); stamps(1); fb.className = 'fb ok'; fb.textContent = 'Right! +1 ' + '📮'; say(said);
        var r = E('div', 'row'); var go = E('button', 'btn', 'Next ▶'); go.type = 'button'; go.onclick = next; r.appendChild(go); p.appendChild(r); go.focus();
        return;
      }
      wrong++; beep(false); line.classList.add('no'); fb.className = 'fb no';
      fb.textContent = wrong < 2 ? 'Not quite. Tap a word to take it back.' : 'Try this order: ' + x.ok[0];
      if (!again[s.id]) { again[s.id] = 1; steps.push(s); total++; }
    }
    draw();
  }
  function ask(p, s) {
    p.appendChild(E('p', 'say', s.prompt));
    if (s.top) p.appendChild(s.top());
    var fb = E('div', 'fb'), opts = E('div', 'opts'), answered = false;
    s.opts.forEach(function (o) {
      var b = E('button', 'opt' + (s.wide ? ' wide' : '') + (s.word ? ' word' : '')); b.type = 'button'; b.appendChild(E('span', null, o));
      b.onclick = function () {
        if (answered) return;
        if (o === s.answer) {
          answered = true; b.classList.add('ok'); beep(true); stamps(1);
          fb.className = 'fb ok'; fb.textContent = 'Right! +1 📮';
          if (s.after) s.after(p);
          say(s.sayAfter || o);
          var r = E('div', 'row'); var go = E('button', 'btn', 'Next ▶'); go.type = 'button'; go.onclick = next; r.appendChild(go); p.appendChild(r); go.focus();
        } else {
          b.classList.add('no'); beep(false); fb.className = 'fb no'; fb.textContent = s.wide ? 'Not this one. Look at where 是不是 goes, and try another.' : 'Not this one. Try another envelope.';
          if (!again[s.id]) { again[s.id] = 1; steps.push(s); total++; }   // a missed question comes back once at the end
        }
      };
      opts.appendChild(b);
    });
    p.appendChild(opts); p.appendChild(fb);
    if (s.sayFirst) say(s.sayFirst);
  }

}
function finish(L) {
  save.done[L.n] = 1; store();

  p.appendChild(E('div', 'card-big', L.letter ? '📬' : '🎉'));

    p.appendChild(letter);
    var r = E('div', 'row'); var send = E('button', 'btn', 'Send ✈️'); send.type = 'button';

    else { var ag = E('button', 'btn', 'Play bingo again'); ag.type = 'button'; ag.onclick = function () { L.run(L); }; r2.appendChild(ag); }
    var bk = E('button', 'btn ghost', 'All levels'); bk.type = 'button'; bk.onclick = menu;
    r2.appendChild(bk); p.appendChild(r2);
  }
  app.appendChild(p);
}

/* ---------- level 4: bingo. Hear it, find it, stamp it. Three cards, each asking a little more. ---------- */
var BINGO_LINES = (function () {
  var out = [], i, j;
  for (i = 0; i < 5; i++) { var r = [], c = []; for (j = 0; j < 5; j++) { r.push(i * 5 + j); c.push(j * 5 + i); } out.push(r, c); }
  out.push([0, 6, 12, 18, 24], [4, 8, 12, 16, 20]);
  return out;
})();
var BINGO_GOALS = [{ lines: 1, text: 'Make 1 line' }, { lines: 2, text: 'Make 2 lines' }, { lines: 12, text: 'Fill the whole card' }];
function bingoItems() {   // every one of the 15 characters, plus 9 of the words
  return CHARS.map(function (x) { return { t: x.c, py: x.py, en: x.en }; })
    .concat(shuffle(WORDS).slice(0, 9).map(function (x) { return { t: x.w, py: x.py, en: x.en }; }));
}
function bingo(L) {
  var cardNo = 0;
  function start() {
    var goal = BINGO_GOALS[cardNo], items = shuffle(bingoItems()), calls = shuffle(items), ci = 0, now = null, wrong = 0, over = false;
    var cells = items.slice(0, 12).concat([{ free: true }], items.slice(12));
    app.innerHTML = '';
    var bar = E('div', 'bar'), fill = E('i'); fill.style.width = Math.round(cardNo / BINGO_GOALS.length * 100) + '%'; bar.appendChild(fill); app.appendChild(bar);
    var p = E('div', 'panel bpanel'); app.appendChild(p);
    p.appendChild(E('div', 'bgoal', 'Card ' + (cardNo + 1) + ' of 3: ' + goal.text));
    var top = E('div', 'row');
    var hear = E('button', 'btn hear', '🔊 Listen again <span class="han">再听一次</span>'); hear.setAttribute('aria-label', 'Listen again'); hear.type = 'button'; hear.onclick = function () { if (now) say(now.t); }; top.appendChild(hear);
    p.appendChild(top);
    var hint = E('div', 'bhint'); p.appendChild(hint);
    var grid = E('div', 'bgrid'); p.appendChild(grid);
    var marked = {}, btns = [];
    cells.forEach(function (c, i) {
      var b = E('button', 'bcell' + (c.free ? ' free on' : '')); b.type = 'button'; b.textContent = c.free ? '📮' : c.t;
      if (c.free) { marked[i] = 1; b.setAttribute('aria-label', 'Free space'); b.disabled = true; }
      else b.onclick = function () { tap(c, i, b); };
      btns.push(b); grid.appendChild(b);
    });
    var end = E('div'); p.appendChild(end);
    var back = E('div', 'row'), ls = E('button', 'btn ghost', 'All levels'); ls.type = 'button'; ls.onclick = menu; back.appendChild(ls); p.appendChild(back);
    function peekOff() { btns.forEach(function (x) { x.classList.remove('peek'); }); }
    function call() {
      if (over || ci >= calls.length) return;
      now = calls[ci++]; wrong = 0; hint.textContent = ''; peekOff();
      say(now.t);
    }
    function linesDone() {
      var n = 0;
      BINGO_LINES.forEach(function (ln) { if (ln.every(function (i) { return marked[i]; })) { n++; ln.forEach(function (i) { btns[i].classList.add('line'); }); } });
      return n;
    }
    function tap(c, i, b) {
      if (over || !now || marked[i]) return;
      if (c.t !== now.t) {
        wrong++; beep(false); b.classList.add('no'); setTimeout(function () { b.classList.remove('no'); }, 350);
        if (wrong === 1) { hint.textContent = 'Not this one. Listen again.'; say(now.t); }
        else if (wrong === 2) hint.textContent = now.py + ' · ' + now.en;
        else { hint.textContent = now.py + ' · ' + now.en; btns.forEach(function (x, k) { if (cells[k].t === now.t) x.classList.add('peek'); }); }
        return;
      }
      marked[i] = 1; b.classList.remove('peek'); b.classList.add('on'); beep(true); if (wrong === 0) stamps(1);
      hint.textContent = '';
      var done = linesDone();
      if (done >= goal.lines) return win();
      now = null; setTimeout(call, 750);
    }
    function win() {
      over = true; now = null; hint.textContent = ''; stamps(5); top.remove(); back.remove();
      end.appendChild(E('div', 'bwin', '🎉 BINGO! +5 📮'));
      var r = E('div', 'row'), last = cardNo === BINGO_GOALS.length - 1;
      var go = E('button', 'btn', last ? 'Finish ▶' : 'Next card ▶'); go.type = 'button';
      go.onclick = function () { if (last) finish(L); else { cardNo++; start(); } };
      r.appendChild(go); end.appendChild(r);
      say('Bingo!'); go.focus();
    }
    call();
  }
  start();
}

/* ---------- the three levels ---------- */
function level1() {   // meet 5, find them by pinyin, find them by sound; three groups
  var out = [];
  GROUPS.forEach(function (g, gi) {
    g.forEach(function (c) { out.push({ type: 'meet', c: c }); });
    shuffle(g).forEach(function (c) {
      out.push({ id: 'p' + c.c, prompt: 'Which envelope says…', answer: c.c, opts: pick3(c.c),
        top: function () { var d = E('div'); d.appendChild(E('div', 'py', c.py)); d.appendChild(E('div', 'mean', c.e + ' ' + c.en)); return d; } });
    });
    shuffle(g).forEach(function (c) {
      out.push({ id: 's' + c.c, prompt: 'Listen, then pick the character you hear.', answer: c.c, opts: pick3(c.c), sayFirst: c.c,
        top: function () { var d = E('div', 'row'); d.appendChild(speakBtn(c.c)); return d; } });
    });
  });
  return out;
}
function level2() {
  return shuffle(WORDS).map(function (w) {
    var miss = w.w.charAt(w.k), shown = w.w.split('').map(function (ch, i) { return i === w.k ? '<span class="slot">？</span>' : ch; }).join('');
    return { id: 'w' + w.w, prompt: 'Which character finishes the word?', answer: miss, opts: pick3(miss), sayAfter: w.w,
      top: function () { var d = E('div'); d.appendChild(E('div', 'emoji', w.e)); d.appendChild(E('div', 'word han', shown)); d.appendChild(E('div', 'mean', w.py + ' · ' + w.en)); return d; },
      after: function (p) { var el = p.querySelector('.slot'); if (el) { el.textContent = miss; el.style.color = 'var(--green)'; el.style.borderColor = 'var(--green)'; } } };
  });
}
function levelPattern() {   // explain the pattern, then take turns: pick the right sentence, build one from tiles
  var P = PATTERN[0];
  return [{ type: 'show' }].concat(PATTERN.slice(1).map(function (x, n) {
    if (x.t === 'build') return { type: 'build', id: 'b' + n, x: x };
    return { id: 'q' + n, prompt: P.ask, wide: true, answer: x.a, opts: shuffle([x.a].concat(x.no)), sayAfter: x.a,
      top: function () { var d = E('div'); d.appendChild(E('div', 'sentence han', x.from)); d.appendChild(E('div', 'mean', x.en)); return d; } };
  }));
}
function level3() {   // the letter level: pick the missing word in each sentence
  return SENTENCES.map(function (s, n) {
    var blank = '<span class="slot">' + s.a.replace(/./g, '？') + '</span>';
    return { id: 'x' + n, prompt: 'Pick the missing word.', word: true, answer: s.a, opts: shuffle([s.a].concat(s.no)), sayAfter: s.s.replace('＿', s.a),
      top: function () { var d = E('div'); d.appendChild(E('div', 'sentence han', s.s.replace('＿', blank))); d.appendChild(E('div', 'mean', s.en)); return d; },
      after: function (p) { var el = p.querySelector('.slot'); if (el) { el.textContent = s.a; el.style.color = 'var(--green)'; el.style.borderColor = 'var(--green)'; } } };
  });
}
