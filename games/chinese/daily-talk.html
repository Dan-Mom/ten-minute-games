/* The shared look of every Chinese lesson game. A lesson sets its own colours (--page, --blue, --blue-s, --blue-d) and its .opt::before. */
:root{
  color-scheme:light;
  --ink:#1d2b4f; --mute:#4a587a; --page:#eef6ff; --card:#fff;
  --blue:#1b6fd1; --blue-s:#d5e9ff; --blue-d:#0f4d97; --red:#d6246e; --red-s:#ffd8ea; --green:#1f8f45; --green-s:#d3f4dd; --gold:#ffd23f;

}
*{box-sizing:border-box}

.top h1{font-size:22px;flex:1 1 240px}

}
