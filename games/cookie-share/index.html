<style>
/* Cookie Share: one idea (dividing) in eight levels, each adding one new thing.
   Children share cookies out and fill bags with their own fingers before answering from memory, then see that dividing undoes multiplying. */
:root{
  color-scheme:light;
  --ink:#3b2417; --mute:#6d5748; --page:#fff4e6; --card:#fff; --line:#ecd9c3;
  --red:#a8622c; --orange:#e8650a; --green:#1f8f45; --bad:#c43a3a; --gold:#ffcc33; --gold-s:#fff5cc; --soft:#ffe9d2; --wood:#b9824c; --wood-s:#f6dfc0;
  --display:"Baloo 2","Nunito","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:800 18px/1.45 var(--body);min-height:100vh}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1}
button{font-family:var(--display);cursor:pointer;color:inherit;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.wrap{max-width:1400px;margin:0 auto;padding:14px 16px 90px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top h1{font-size:clamp(24px,4.5vw,34px);color:var(--red);margin-right:auto}
.stars{font:800 18px var(--display);color:#8a6400;background:var(--gold-s);border-radius:999px;padding:6px 14px}
.round{border:0;background:#fff;border-radius:999px;min-width:44px;min-height:44px;font-size:20px;box-shadow:0 3px 0 var(--line)}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.tool{border:0;border-radius:18px;min-height:64px;padding:8px 12px;background:var(--gold-s);box-shadow:0 5px 0 #e5cf7c;font-size:19px;color:#6d4f00}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:14px;margin-top:16px}
.lv{position:relative;text-align:left;border:0;background:var(--card);border-radius:22px;padding:14px 16px;min-height:118px;box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;gap:4px}
.lv:disabled{opacity:.55;cursor:not-allowed}
.lv.now{outline:4px solid var(--orange);outline-offset:-2px}
.lv b{font:800 21px var(--display);color:var(--red)}
.lv span{font:700 15px var(--body);color:var(--mute)}
.lv i{font-style:normal;font-size:15px;color:#8a6400;margin-top:auto}
.why{margin-top:18px;background:#fff;border-radius:18px;padding:14px 16px;font:700 15px/1.5 var(--body);color:var(--mute)}
.why b{color:var(--ink)}
.bar{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.back{border:0;background:#fff;border-radius:14px;min-height:44px;padding:0 14px;font-size:16px;color:var(--red);box-shadow:0 3px 0 var(--line)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots span{width:13px;height:13px;border-radius:50%;background:#e7dccf}
.dots span.ok{background:var(--gold)} .dots span.try{background:#e0b98f}
.dots span.now{outline:3px solid var(--red);outline-offset:1px}
.panel{margin-top:14px;background:var(--card);border-radius:26px;padding:16px;box-shadow:0 6px 0 var(--line)}
.steps{display:grid;gap:12px;margin-top:12px}
.step{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-radius:18px;padding:12px 14px;min-height:72px;background:var(--soft);box-shadow:0 4px 0 #e6c49d}
.step:disabled{opacity:.5;cursor:not-allowed}
.step.next{background:#ffd9ae;box-shadow:0 4px 0 #e0a877}
.step em{font-style:normal;font-size:30px}
.step b{display:block;font:800 20px var(--display)}
.step small{font:700 15px var(--body);color:var(--mute)}
.goal{font:700 16px/1.45 var(--body);color:var(--mute);margin-top:8px}
.prompt{font:800 clamp(19px,3.4vw,25px)/1.28 var(--display);text-align:center;min-height:2.6em;display:flex;align-items:center;justify-content:center;gap:8px}
.big{font:800 clamp(34px,7vw,50px)/1.1 var(--display);text-align:center;margin:6px 0}
.big u{text-decoration:none;display:inline-block;min-width:1.5em;border-bottom:5px solid var(--red);color:var(--orange)}
.big u.good{color:var(--green);border-color:var(--green)}
.big u.bad{color:var(--bad);border-color:var(--bad);animation:shake .35s}
.hint{margin-top:8px;text-align:center;font:700 17px var(--body);color:var(--mute)}
.row{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{border:0;border-radius:16px;min-height:52px;padding:0 22px;font-size:21px;color:#fff;background:var(--orange);box-shadow:0 5px 0 #a5450a}
.btn:active{transform:translateY(2px)}
.btn.alt{background:#fff;color:var(--red);box-shadow:0 4px 0 var(--line)}
.btn.small{min-height:46px;font-size:18px;padding:0 14px}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* the cookies */
.stall{display:flex;flex-direction:column;gap:12px;align-items:center;--a:40px}
.pile{display:flex;flex-wrap:wrap;justify-content:center;width:100%;min-height:calc(var(--a) + 4px)}
.plates{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%}
.plate{display:grid;gap:0;justify-content:center;align-content:center;padding:8px;min-width:calc(var(--a) * 1.8);min-height:calc(var(--a) * 1.8);border-radius:50%;background:#fff;box-shadow:inset 0 0 0 4px #e3c9a6,0 3px 0 var(--line)}
.plate.bag{border-radius:12px;background:var(--wood-s);box-shadow:inset 0 0 0 4px var(--wood),0 3px 0 #8d6236}
.block{display:grid;justify-content:center;gap:0}
.ap{display:flex;align-items:center;justify-content:center;width:var(--a);height:var(--a);font-size:calc(var(--a) * .82);line-height:1;border:0;background:none;padding:0}
button.ap{cursor:pointer;border-radius:50%}
button.ap.tapme{box-shadow:0 0 0 3px #f4b183}
.pop{animation:pop .3s ease backwards}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
.left{font:800 22px var(--display);color:var(--orange);text-align:center;margin-top:6px}

/* number pad */
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:12px auto 0}
.pad button{min-height:54px;border:0;border-radius:14px;background:var(--soft);color:var(--red);font-size:26px;box-shadow:0 4px 0 #e6c49d}
.pad button:active,.pad button.on{transform:translateY(2px);filter:brightness(.92)}
.done{text-align:center}
.done .big-e{font-size:60px}

/* rewards the child types */
.rchip{margin-left:auto;max-width:min(100%,420px);padding:8px 14px;border-radius:999px;background:var(--gold-s);border:2px solid var(--gold);color:#6d4f00;font:800 17px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv .rcorner{position:absolute;top:-8px;right:10px;max-width:70%;padding:3px 10px;border-radius:999px;background:var(--gold);color:#5f4500;font:800 13px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rlist{display:grid;gap:12px;margin-top:14px}
.rrow{display:grid;grid-template-columns:78px minmax(0,1fr) 104px;align-items:center;gap:10px}
.rrow b{font:800 22px var(--display);color:#8a6400}
.rrow input{width:100%;min-height:56px;padding:0 14px;border:3px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font:800 20px var(--body)}
.rrow input:focus{outline:0;border-color:var(--orange)}
.rrow span{font:800 15px var(--display);color:var(--mute);text-align:right}
.rrow.won{background:var(--gold-s);border-radius:16px;padding:6px 8px}
.rrow.won span{color:var(--green)}
@media (max-width:520px){.rrow{grid-template-columns:64px minmax(0,1fr)}.rrow span{grid-column:2;text-align:left}}
.earned{margin:10px auto 0;max-width:640px;padding:12px 16px;border-radius:16px;background:var(--gold-s);border:3px solid var(--gold);font:800 22px var(--display);color:#6d4f00}

/* tablets and computers: bigger words and buttons */
@media (min-width:700px){
  .prompt{font-size:30px}
  .big{font-size:60px}
  .hint{font-size:20px}
  .btn{min-height:64px;padding:0 30px;font-size:26px}
  .btn.small{min-height:56px;font-size:22px}
  .back{min-height:52px;font-size:20px}
  .pad{width:100%;max-width:360px}
  .pad button{min-height:68px;font-size:32px}
}
/* a wide screen: cookies on the left, answer keys on the right, so both fit without scrolling */
@media (min-width:900px) and (orientation:landscape){
  .split{display:grid;grid-template-columns:minmax(0,1fr) 360px;column-gap:20px;align-items:start}
  .split > *{grid-column:2}
  .split > .prompt{grid-column:1 / -1}
  .split > .stallbox{grid-column:1;grid-row:2 / span 8}
}
</style>
</head>
