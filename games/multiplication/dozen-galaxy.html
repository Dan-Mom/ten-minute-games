}
/* a tap that lands on Next straight after Check (a double tap, or a tap meant for Check) must not skip what the screen just said */
function dzTapTooSoon(){ return !!(dz.fb && dz.fb.t && performance.now() - dz.fb.t < 500); }
function dzSpeech(o){
  const cap = DZ_CAPTAINS[o.captain];
  return o.kind === "reverse" ? cap.n+" says: the station needs "+o.crystals+" crystals. How many pods?" : cap.n+" says: "+dzPlural(o.n,"pod","pods")+" for the space station, please!";
}
function dzTankPct(){
  const c = dz.cur, partial = (dz.sh === 1 && c && !c.done) ? c.stepsDone / 3 : 0;
  return Math.min(100, Math.round((dz.delivered + partial) / DZ_ORDERS_PER_FLIGHT * 100));
}
function dzDraw(){
  dzStopTimer(); dzFlying(true);
  if(dz.fb && !dz.fb.t) dz.fb.t = performance.now();       // when this feedback first appeared (see dzTooSoonToSkip, dzTapTooSoon)
  const app = $dz("app"), cur = dz.cur, o = cur.order, cap = DZ_CAPTAINS[o.captain], sh = dz.sh, def = DZ_FLIGHTS[sh-1], n = o.n;
  const sp = dzSplit(n), step = cur.step, answered = dz.roundTotal - dz.orders.length, pct = Math.min(100, Math.round(answered / dz.roundTotal * 100));
  const orderNo = Math.min(dz.roundTotal, cur.done ? answered : answered + 1);   // a settled order has left the queue; before that it is still the current one. Never 0, never backwards.
  const tank = dzTankPct(), answering = dz.phase !== "fb";
  /* the scene: pods (or sealed), words. Every feedback screen opens the pods: the picture is the explanation, and there is no Scan button by then. */
  const open = o.retry || cur.scanned || sh === 1 || !answering;
  const scanBtn = (answering && sh > 1 && !o.retry) ? '<button class="btn secondary small" id="dzScan" aria-pressed="'+cur.scanned+'">🔍 '+(cur.scanned ? "Hide scan" : "Scan the pods")+'</button>' : "";
  const sealed = '<div class="dz-sealed">🔒 The pods are sealed.<br>'+scanBtn+'</div>';
  let scene;
  if(!answering){
    scene = dzTrayHtml(n, sh === 1 ? (step === 1 ? "blue" : step === 2 ? "pink" : "all") : "all", cur.pop) + '<div class="dz-legend">Every pod: <span class="dz-blue">10 blue</span> + <span class="dz-pinkt">2 pink</span></div>';
  } else if(o.kind === "pods"){
    if(open){
      const focus = step === 1 ? "blue" : step === 2 ? "pink" : "all";
      scene = dzTrayHtml(n, sh === 1 ? focus : "all", cur.pop);
      scene += sh === 1
        ? '<div class="dz-legend">Every pod: <span class="dz-blue">10 blue</span> + <span class="dz-pinkt">2 pink</span></div>'
        : '<div class="dz-words">Every pod = 10 blue + 2 pink.<br>So '+dzPlural(n,"pod","pods")+' = 10 × '+n+' + 2 × '+n+'</div>';
      if(scanBtn) scene += '<div class="dz-hidescan">'+scanBtn+'</div>';
    } else scene = sealed;
  } else {
    scene = open ? '<div class="dz-one" role="img" aria-label="One pod: 10 blue crystals and 2 pink crystals, 12 in all.">'+dzPodSvg()+'</div><div class="dz-words">One pod = 10 blue + 2 pink = 12 crystals</div>' + (scanBtn ? '<div class="dz-hidescan">'+scanBtn+'</div>' : "")
                 : sealed;
  }
  const speech = o.kind === "reverse" ? "“The station needs "+o.crystals+" crystals. How many pods?”" : "“"+dzPlural(n,"pod","pods")+" for the space station, please!”";
  /* the question */
  let label = "", big, sub, chips = "";
  if(step > 0){
    label = "12 × "+n+" · Step "+step+" of 3";
    if(step === 1){ big = "10 × "+n+" = ?"; sub = "Blue crystals: 10 in every pod."; }
    else if(step === 2){ big = "2 × "+n+" = ?"; sub = "Pink crystals: 2 in every pod."; }
    else { big = sp.tens+" + "+sp.twos+" = ?"; sub = "Add the blue and the pink to get 12 × "+n+"."; }
    if(step >= 2 && step < 3) chips += '<span class="dz-chip"><i class="b"></i>blue: '+sp.tens+'</span>';
  } else if(o.kind === "reverse"){
    label = "Backwards order"; big = "12 × ? = "+o.crystals; sub = "Each pod holds 12 crystals. How many pods?";
  } else {
    label = "Order"; big = "12 × "+n+" = ?"; sub = dzPlural(n,"pod","pods")+", 12 crystals in each.";
  }
  if(!answering && dz.fb && dz.fb.fact){ big = dz.fb.fact; sub = ""; chips = ""; }
  const off = answering ? "" : "disabled";
  const actions = answering
    ? '<button class="btn" id="dzCheck" '+(dz.typed === "" ? "disabled" : "")+'>Check ✓</button>'
    : '<button class="btn" id="dzNext">Next ▶</button>';
  const pad = [7,8,9,4,5,6,1,2,3].map(k=>'<button data-k="'+k+'" '+off+'>'+k+'</button>').join("")
    + '<button class="clear" data-k="clear" aria-label="Clear the answer" '+off+'>Clear</button><button data-k="0" '+off+'>0</button><button class="back" data-k="back" aria-label="Backspace" '+off+'>⌫</button>';
  let dots = ""; for(let i=0;i<DZ_ORDERS_PER_FLIGHT;i++) dots += '<span class="'+(i < dz.delivered ? "on" : "")+'">★</span>';
  const gauge = (sh === 3 && dzTimerOn) ? '<div class="dz-gauge"><div class="bar" role="img" aria-label="Fuel gauge. Only a gentle guide: nothing happens when it runs out."><i id="dzGaugeFill"></i></div><small id="dzGaugeNote"></small></div>' : "";
  /* the answer box keeps what the child typed until they start typing again, coloured right or wrong */
  const inBox = dz.typed !== "" ? dz.typed : dz.shown, boxCls = dz.typed === "" && dz.shown ? dz.shownCls : "";
  const phaseName = answering ? "ask" : dz.fb && dz.fb.cls === "ok" ? "right" : "wrong";
  app.innerHTML = '<div class="dz dz-fv" data-phase="'+phaseName+'">'
    + '<div class="dz-top"><div class="dz-tag">🚀 Flight '+sh+'<span class="dz-fname"> · '+def.name+'</span></div>'
    + '<div class="dz-orderno redo-note" style="opacity:1;margin:0;">Order '+orderNo+' of '+dz.roundTotal+(dz.round > 1 ? ' · Try '+dz.round : '')+'</div><div class="grp">'
    + (sh === 3 ? '<button class="btn secondary small" id="dzGaugeBtn" aria-pressed="'+dzTimerOn+'" aria-label="Fuel gauge: '+(dzTimerOn ? "on" : "off")+'">⏱ '+(dzTimerOn ? "on" : "off")+'</button>' : '')
    + '<button class="btn secondary small" id="dzLeaveBtn">Leave ✕</button></div></div>'
    + '<div class="dz-progress" role="progressbar" aria-label="Orders this try" aria-valuemin="0" aria-valuemax="'+dz.roundTotal+'" aria-valuenow="'+answered+'"><div style="width:'+pct+'%"></div></div>'
    + '<div class="card dz-card">'
    + '<div class="dz-meters"><div class="dz-tankwrap"><span aria-hidden="true">⛽</span><div class="dz-tank" id="dzTank" role="img" aria-label="Fuel tank '+tank+' percent full"><i style="width:'+tank+'%"></i></div></div>'
    + '<div class="dz-dots" role="img" aria-label="Constellation this flight: '+dz.delivered+' of 12 stars lit">'+dots+'</div>'
    + '<div class="dz-combo" id="dzCombo">'+(dz.combo >= 2 ? "🔥 ×"+dz.combo : "")+'</div></div>'
    + gauge
    + '<div class="dz-cols"><div class="dz-scene" id="dzScene"><div class="dz-captain"><div class="dz-avatar" aria-hidden="true">'+cap.e+'</div>'
    + (dz.fb ? '<div class="dz-fb '+dz.fb.cls+'" id="dzFb">'+dz.fb.text+'</div>' : '<div class="dz-bubble"><b class="dz-capname">'+cap.n+':</b> '+speech+'</div>')+'</div>'+scene+'</div>'
    + '<div class="dz-play"><div class="dz-stepl">'+label+'</div><div class="dz-big" id="dzBig">'+big+'</div>'+(sub ? '<p class="dz-sub">'+sub+'</p>' : "")+(chips ? '<div class="dz-chips">'+chips+'</div>' : "")
    + '<div class="dz-ansrow"><div class="answer-display dz-answer '+(inBox === "" ? "empty" : "")+(boxCls ? " "+boxCls : "")+'" id="dzAnswer" aria-label="Your answer: '+(inBox === "" ? "nothing typed yet" : inBox)+'">'+(inBox === "" ? "?" : inBox)+'</div>'
    + '<div class="dz-actions">'+actions+'</div></div>'
    + '<div class="dz-pad" id="dzPad">'+pad+'</div></div></div>'
    + '</div></div>';
  /* wiring */
  $dz("dzLeaveBtn").addEventListener("click", dzRenderLeave);
  const gb = $dz("dzGaugeBtn");
  if(gb) gb.addEventListener("click", ()=>{ dzTimerOn = !dzTimerOn; if(!session.guest){ try{ localStorage.setItem(DZ_TIMER_KEY, dzTimerOn ? "1" : "0"); }catch(e){} } dzDraw(); });
  document.querySelectorAll("#dzPad button").forEach(b=>b.addEventListener("click", (ev)=>{
    const k = b.dataset.k;
    dz.shown = "";
    if(k === "clear"){ dz.typed = ""; } else if(k === "back"){ dz.typed = dz.typed.slice(0,-1); } else { dz.typed = dzAddDigit(dz.typed, k); }
    dzUpdateAnswer();
    if(ev.detail > 0){ dzKbd = false; b.blur(); }          // a mouse or finger tap: keep Enter free to mean "check"
  }));
  const ck = $dz("dzCheck"); if(ck) ck.addEventListener("click", ()=>{ dzKbd = false; dzSubmit(); });
  const sc = $dz("dzScan");
  if(sc) sc.addEventListener("click", ()=>{ cur.scanned = !cur.scanned; if(cur.scanned) dz.scans++; dzDraw(); const b2 = $dz("dzScan"); if(b2) b2.focus({ preventScroll:true }); });
  const nx = $dz("dzNext"); if(nx){ nx.addEventListener("click", (ev)=>{ if(dzTapTooSoon()) return; if(ev.detail === 0 && dzTooSoonToSkip()) return; dzGo(); }); if(dz.fb && dz.fb.cls !== "ok") nx.focus({ preventScroll:true }); }   // a tap on the heels of Check is ignored for half a second; a key-made click (detail 0) right after a wrong answer for a moment longer
  dzFitTray();
  if(gauge && answering) dzStartTimer();
}
function dzUpdateAnswer(){
  const disp = $dz("dzAnswer"), ck = $dz("dzCheck");
  if(disp){ dz.shown = ""; disp.classList.remove("wrong","correct"); disp.textContent = dz.typed === "" ? "?" : dz.typed; disp.classList.toggle("empty", dz.typed === ""); disp.setAttribute("aria-label", "Your answer: " + (dz.typed === "" ? "nothing typed yet" : dz.typed)); }
  if(ck) ck.disabled = dz.typed === "";
}
function dzStartTimer(){
  const fill = $dz("dzGaugeFill"), note = $dz("dzGaugeNote"); if(!fill) return;
  const tick = ()=>{
    const left = Math.max(0, 1 - (performance.now() - dz.cur.t0) / DZ_GAUGE_MS);
    fill.style.width = Math.round(left * 100) + "%";
    if(note) note.textContent = left <= 0 ? "Tank empty? No worries: take your time, Captain." : "";
  };
  tick(); dzTimerHandle = setInterval(tick, 250);
}

/* ---- checking an answer ---- */
function dzFly(color, count){
  if(dzReduced()) return;
  const src = document.querySelector("#dzScene .dz-tray, #dzScene .dz-one, #dzScene .dz-sealed"), dst = $dz("dzTank");
  if(!src || !dst) return;
  const a = src.getBoundingClientRect(), b = dst.getBoundingClientRect();
  for(let i=0;i<Math.min(count, 8);i++){
    const s = document.createElement("span"); s.className = "dz-fly " + color; s.setAttribute("aria-hidden","true"); s.textContent = "◆";
    const x = a.left + a.width * (0.2 + 0.6 * Math.random()), y = a.top + a.height * (0.2 + 0.6 * Math.random());
    s.style.left = x + "px"; s.style.top = y + "px"; document.body.appendChild(s);
    const dx = b.left + b.width / 2 - x, dy = b.top + b.height / 2 - y;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ s.style.transitionDelay = (i * 50) + "ms"; s.style.transform = "translate("+dx+"px,"+dy+"px) scale(.4)"; s.style.opacity = ".15"; }));
    setTimeout(()=>{ if(s.parentNode) s.parentNode.removeChild(s); }, 1000 + i * 50);
  }
}
function dzSetNext(fn, autoMs){
  const my = ++dz.token; dz.next = fn;
  if(autoMs) setTimeout(()=>{ if(dz.active && dz.token === my && dz.next === fn) dzGo(); }, autoMs);
}
function dzGo(){
  if(!dz.active || dz.phase !== "fb" || !dz.next) return;
  const fn = dz.next; dz.next = null; dz.token++; fn();
}
function dzAfterOrder(){          // what comes after an order is finished: next order, the comeback screen, or the finish screen
  if(dz.orders.length > 0) dzNextOrder();
  else if(dz.missed.length > 0) dzRenderReview();
  else dzFinish(true);
}
/* an order is settled: clean = served without a miss (a star lights on the map); otherwise it is queued to come back */
function dzSettle(clean){
  const o = dz.cur.order; dz.cur.done = true; dz.orders.shift(); dz.lastKey = dzOrderKey(o);
  let extra = "";
  if(clean){
    const before = dzRec(), after = dzAddPod(before);
    dzSave(after); dz.delivered++;
    if(o.firstTry) dz.firstTry++;
    dz.combo = dzNextCombo(dz.combo, true, o.firstTry); dz.bestCombo = Math.max(dz.bestCombo, dz.combo);
    if(before.pods < DZ_MAP_SIZE){          // once the map is full (96) it stays full: no more stars to light
      dz.litNew++;
      extra = " ✨ New star!";
      const was = dzMap(before.pods).constellations, now = dzMap(after.pods).constellations;
      if(now > was){ extra = " ✨ You finished the " + DZ_CONSTELLATIONS[now - 1] + " constellation!"; dz.cur.bigMoment = true; }
    }
  } else {
    if(o.firstTry){ dz.missedFirst++; }
    o.firstTry = false; dz.missed.push(o);
    dz.combo = 0;
  }
  return extra;
}
function dzSubmit(){
  if(!dz.active || dz.phase !== "ask" || dz.typed === "") return;
  const cur = dz.cur, o = cur.order, n = o.n, sp = dzSplit(n), step = cur.step, typed = dz.typed;
  const cheer = dzPick(DZ_CHEER, dz.delivered + dz.token + n);
  if(step > 0){
    const res = dzTrainStep(cur, n, typed);                     // "right", "hint" (first miss on this step) or "reveal" (second miss); the miss count is per step
    if(res === "right"){
      cur.stepsDone++;
      if(step < 3){
        dz.phase = "fb"; cur.pop = step === 1 ? "blue" : "pink";
        dz.fb = { cls:"ok", fact: step === 1 ? "10 × "+n+" = "+sp.tens : "2 × "+n+" = "+sp.twos, text: step === 1 ? "Yes! "+sp.tens+" blue crystals fly to the fuel tank." : "Yes! "+sp.twos+" pink crystals join them." };
        dz.shown = typed; dz.shownCls = "correct"; dz.typed = ""; dzSetNext(()=>{ cur.step++; cur.pop = ""; dz.phase = "ask"; dz.fb = null; dz.typed = ""; dz.shown = ""; dzDraw(); dzFocusQuestion(); }, DZ_STEP_MS);
        dzDraw(); dzFly(step === 1 ? "blue" : "pink", step === 1 ? Math.min(n, 8) : 2);
        dzSay(dz.fb.text);
        return;
      }
      const clean = !cur.orderMissed, extra = dzSettle(clean);
      dz.phase = "fb";
      dz.fb = clean ? { cls:"ok", fact:dzFact(n), text: "That's the trick: "+dzFactTrick(n)+"! "+cheer+extra }
                    : { cls:"info", fact:dzFact(n), text:"You worked it out: "+dzFactBuilt(n)+". It will come back at the end for one more try." };
      dz.shown = typed; dz.shownCls = "correct"; dz.typed = ""; dzSetNext(dzAfterOrder, clean && !cur.bigMoment ? DZ_READ_MS : 0); dzDraw(); if(clean) dzFly("blue", 6); dzSay(dz.fb.text);
      return;
    }
    /* a miss while training: a hint first, then the answer is shown and we move on (never stuck) */
    cur.orderMissed = true; dz.shown = typed; dz.shownCls = "wrong"; dz.typed = "";
    if(res === "hint"){
      dz.fb = { cls:"no", text: dzTrainHint(step, n) };
      dzDraw(); dzSay(dz.fb.text);
      return;
    }
    cur.stepsDone++;
    const reveal = dzTrainReveal(step, n);
    if(step < 3){
      dz.phase = "fb"; dz.fb = { cls:"no", fact: step === 1 ? "10 × "+n+" = "+sp.tens : "2 × "+n+" = "+sp.twos, text: reveal+" On we go!" };
      dzSetNext(()=>{ cur.step++; dz.phase = "ask"; dz.fb = null; dz.typed = ""; dz.shown = ""; dzDraw(); dzFocusQuestion(); }, 0);
      dzDraw(); dzSay(dz.fb.text); return;
    }
    dzSettle(false);
    dz.phase = "fb"; dz.fb = { cls:"no", fact:dzFact(n), text: dzFactBuilt(n)+". It will come back at the end for one more try." };
    dzSetNext(dzAfterOrder, 0); dzDraw(); dzSay(dz.fb.text);
    return;
  }
  /* one-answer orders (Space Mission, Meteor Shower) */
  if(dzCheck(o, typed)){
    const retry = !o.firstTry, extra = dzSettle(true);
    dz.phase = "fb";
    dz.fb = { cls:"ok", fact:dzFact(n), text: dzFact(n)+"! "+(retry ? "Got it this time!" : cheer)+extra };
    dz.shown = typed; dz.shownCls = "correct"; dz.typed = ""; dzSetNext(dzAfterOrder, cur.bigMoment ? 0 : DZ_READ_MS); dzDraw(); dzFly("blue", 6); dzSay(dz.fb.text);
  } else {
    dzSettle(false);
    const kind = dzKindLine(typed, o.answer, n + dz.token);
    const why = o.kind === "reverse" ? dzFact(n)+", so "+o.crystals+" crystals fill "+dzPlural(n,"pod","pods")+"."
                                     : dzFactTrick(n)+".";
    dz.phase = "fb";
    dz.fb = { cls:"no", fact:dzFact(n), text: kind+" "+why+" It will come back at the end." };
    dz.shown = typed; dz.shownCls = "wrong"; dz.typed = ""; dzSetNext(dzAfterOrder, 0); dzDraw(); dzSay(dz.fb.text);
  }
}

/* ---- leaving, the comeback screen, the finish screen ---- */
function dzRenderLeave(){
  dzStopTimer(); dz.token++; dzFlying(false);
  $dz("app").innerHTML = '<div class="dz"><div class="card dz-card" style="text-align:center;"><h2>Leave the flight?</h2><p>No problem. '+(session.guest ? "" : "Your stars, badges and star map are all safe. ")+'Orders from this flight will start fresh next time.</p>'
    + '<div class="row"><button class="btn" id="dzStay">Keep flying</button><button class="btn secondary" id="dzBye">Yes, back to Mission Control</button></div></div></div>';
  $dz("dzStay").addEventListener("click", ()=>{ dzDraw(); });
  $dz("dzBye").addEventListener("click", dzRenderHub);
  $dz("dzStay").focus({ preventScroll:true });
}
function dzRenderReview(){
  dzStopTimer(); dz.phase = "review"; dzFlying(false);
  const k = dz.missed.length;
  const rows = dz.missed.map(o=>'<div>'+DZ_CAPTAINS[o.captain].e+' '+DZ_CAPTAINS[o.captain].n+': '+(o.kind === "reverse" ? dzPlural(o.crystals,"crystal","crystals")+' needed' : dzPlural(o.n,"pod","pods")+' ordered')+'</div>').join("");
  $dz("app").innerHTML = '<div class="dz"><div class="card dz-card" style="text-align:center;"><h2 id="dzTitle" tabindex="-1">Nearly there, Captain!</h2>'
    + '<p>'+dzPlural(k,"order is","orders are")+' waiting on the launch pad. Want to try '+(k === 1 ? "it" : "them")+' again? '+(dz.sh === 1 ? "You'll build "+(k === 1 ? "it" : "them")+" with the trick again, one step at a time." : "The pods will be open this time, so you can use the trick.")+'</p>'
    + '<div class="dz-list">'+rows+'</div>'
    + '<div class="row"><button class="btn" id="dzRetryYes">Yes, launch '+(k === 1 ? "it" : "them")+'</button><button class="btn secondary" id="dzRetryNo">Not now</button></div></div></div>';
  $dz("dzRetryYes").addEventListener("click", ()=>{
    dz.orders = dzRetryQueue(dz.missed, Math.random, dz.lastKey); dz.missed = []; dz.round++; dz.roundTotal = dz.orders.length; dzNextOrder();
  });
  $dz("dzRetryNo").addEventListener("click", ()=>dzFinish(false));
  $dz("dzTitle").focus({ preventScroll:true }); dzSay("Some orders are waiting to be tried again.");
}
function dzFinish(resolved){
  dzStopTimer(); dz.phase = "done"; dzFlying(false);
  const sh = dz.sh, def = DZ_FLIGHTS[sh-1], stars = dzStars(DZ_ORDERS_PER_FLIGHT, dz.missedFirst, resolved);
  let d = dzRec(), hadBefore = d.flights[sh].plays > 0;
  if(resolved){
    d = dzApplyFinish(d, sh, stars).d; dzSave(d); d = dzRec();
    /* one passport event per finished flight. No "unit_completed": the passport would count the whole game as a learned idea (Times Tables lit, 10 sparks) before the 20 rounds were done. */
    dzFinishEvents(sh, dz.round, dz.scans, hadBefore).forEach(ev=>fmtHook(ev.name, ev.data));
  }
  const newBadges = d.badges.filter(id=>dz.badgesAtStart.indexOf(id) < 0);      // every badge earned during this flight, Star Mapper included (it is earned on an order, not at the finish)
  const m = dzMap(d.pods), added = dz.litNew;
  const starRow = resolved ? '<div class="dz-bigstars" role="img" aria-label="'+stars+' of 3 stars">' + [1,2,3].map(i=>'<span class="'+(i <= stars ? "pop" : "")+'" style="'+(i <= stars ? "animation-delay:"+(i*0.18)+"s" : "opacity:.35")+'">'+(i <= stars ? "★" : "☆")+'</span>').join("") + '</div>' : "";
  const nb = newBadges.map(id=>{ const b = DZ_BADGES.filter(x=>x.id === id)[0]; return '<div class="dz-newbadge">'+b.icon+' New badge: <b>'+b.name+'</b>!</div>'; }).join("");
  const msg = resolved ? (stars === 3 ? "Great flying, Captain! Every pod arrived." : stars === 2 ? "Nice flying! The trick is working." : "You got every order there in the end. That's what counts.") : "Good flying! Finish every order to earn this flight's stars." + (session.guest ? "" : " Every star you lit is kept.");
  const nextBtn = (resolved && sh < 3) ? '<button class="btn" id="dzNextFlight">Next: Flight '+(sh+1)+'</button>' : "";
  $dz("app").innerHTML = '<div class="dz"><div class="card dz-card" style="text-align:center;"><h2 id="dzTitle" tabindex="-1">'+(resolved ? "Flight "+sh+" complete! 🚀" : "Flight "+sh+": good practice! 💪")+'</h2>'
    + '<p class="dz-sub">'+def.name+'</p>'+starRow+'<p>'+msg+'</p>' + nb
    + '<div class="dz-statrow"><div><div class="n">'+dz.firstTry+' / '+DZ_ORDERS_PER_FLIGHT+'</div><div class="l">right first time</div></div>'
    + '<div><div class="n">+'+added+'</div><div class="l">stars lit on the map</div></div>'
    + (dz.bestCombo >= 2 ? '<div><div class="n">×'+dz.bestCombo+'</div><div class="l">best combo</div></div>' : '') + '</div>'
    + '<div class="row">'+nextBtn+'<button class="btn '+(nextBtn ? "secondary" : "")+'" id="dzAgain">Fly this one again</button><button class="btn secondary" id="dzHubBtn">Mission Control</button><button class="btn secondary" id="dzMapBtn">Round map</button></div>'
    + '<h3 style="margin-top:14px;">Your star map: '+m.lit+' of '+DZ_MAP_SIZE+'</h3>' + dzMapHtml(d.pods) + '</div></div>';
  if($dz("dzNextFlight")) $dz("dzNextFlight").addEventListener("click", ()=>dzStart(sh+1));
  $dz("dzAgain").addEventListener("click", ()=>dzStart(sh));
  $dz("dzHubBtn").addEventListener("click", dzRenderHub);
  $dz("dzMapBtn").addEventListener("click", ()=>{ dzLeave(); renderLevels(); });
  window.scrollTo(0, 0); $dz("dzTitle").focus({ preventScroll:true });
  dzSay(resolved ? "Flight complete. "+stars+" of 3 stars." : "Flight ended. Your stars are kept.");
}

/* ---- keyboard: digits type, Backspace deletes, Enter checks (or goes to the next order) ---- */
document.addEventListener("keydown", (e)=>{
  if(!dz.active || !$dz("dzAnswer")) return;
  if(e.target && /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.key.length === 1 && e.key >= "0" && e.key <= "9"){ dzKbd = true; if(dz.phase === "ask"){ dz.typed = dzAddDigit(dz.typed, e.key); dzUpdateAnswer(); } }
  else if(e.key === "Backspace"){ dzKbd = true; if(dz.phase === "ask"){ dz.typed = dz.typed.slice(0,-1); dzUpdateAnswer(); } }
  else if(e.key === "Enter"){
    const t = e.target, onButton = t && t.tagName === "BUTTON";
    if(onButton && !dzKbd) return;                               // a focused button: Enter presses it, as usual
    e.preventDefault();
    if(dz.phase === "ask") dzSubmit(); else if(dz.phase === "fb"){ if(e.repeat || dzTooSoonToSkip()) return; dzGo(); }
  }
  else if(e.key === "Tab"){ dzKbd = false; }
});
document.addEventListener("pointerdown", ()=>{ dzKbd = false; });

/* ---- the built-in self-test: open this page with #selftest on the end of the address ---- */
function dzRunSelfTest(){
  const r = dzSelfTest(); window.__dzSelfTest = { pass:r.pass, fail:r.fail, failed:r.results.filter(x=>!x.ok).map(x=>x.name) };
  $dz("app").innerHTML = '<div class="card result-card dz-selftest"><h2>Dozen Galaxy self-test</h2><p id="dzSelfTestSummary"><b>'+r.pass+' passed, '+r.fail+' failed</b></p><ul style="text-align:left;list-style:none;padding:0;">'
    + r.results.map(x=>'<li class="'+(x.ok ? "" : "bad")+'">'+(x.ok ? "PASS" : "FAIL")+' · '+x.name+(x.ok ? "" : " → "+x.info)+'</li>').join("") + '</ul><div class="row"><button class="btn secondary small" id="dzSelfTestClose">Close the self-test</button></div></div>';
  $dz("dzSelfTestClose").addEventListener("click", ()=>{ location.hash = ""; location.reload(); });
  document.title = "Self-test: " + (r.fail ? r.fail + " FAILED" : "all " + r.pass + " passed");
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {
      /* offline install just won't be available — app still works online */
    });
  });
}

if(location.hash === "#selftest"){ dzRunSelfTest(); }
else if(FMT.guest){                                                          // "Just looking": no name asked, nothing read or stored; progress lives in this page only
  session.guest = true; session.name = "Guest"; session.rec = freshKidRecord();
  storeNote(true);
  dzEnter();
}
else if(FMT.profile){
  setPlayer(FMT.profile.charAt(0).toUpperCase()+FMT.profile.slice(1));       // the passport animal, never a typed name
  dzEnter();
} else renderStart();
</script>
<script>(function backPill() {
  try { if (window.parent !== window) return; } catch (e) { return; }
  var m = /[?&]home=([^&]*)/.exec(location.search || ''); if (!m) return;
  var h; try { h = decodeURIComponent(m[1]); } catch (e) { return; }
  if (!/^[A-Za-z0-9._%~/-]+$/.test(h) || h.indexOf('//') >= 0) return;
  var a = document.createElement('a'); a.href = h; a.textContent = '← Home';
  a.setAttribute('style', 'position:fixed;z-index:2147483647;box-sizing:border-box;display:inline-flex;align-items:center;min-height:44px;min-width:44px;padding:0 16px;background:#1f5f99;color:#fff;font:600 14px system-ui,sans-serif;border-radius:999px;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.35);opacity:.92');
  document.body.appendChild(a);
  /* The lessons keep their own buttons along the screen edges (Previous / Next in a footer, controls in a header), so a pill nailed to
     one corner always sat on top of something. Keep the pill 44px tall (easy to tap) and, whenever the page layout changes, put it in
     whichever of six edge spots does not cover a button, link or field (spots tried in this order: bottom-centre, bottom-left,
     bottom-right, top-centre, top-left, top-right). Buttons that are always on screen (fixed or sticky) count much more than ones
     that scroll away. It never moves while the child is just scrolling, and stays where it is as long as its spot is free. */
  var SPOTS = ['bc', 'bl', 'br', 'tc', 'tl', 'tr'], cur = '', timer = 0;
  var SEL = 'button,a[href],input,select,textarea,summary,label,[role=button],[role=tab],[tabindex]:not([tabindex="-1"])';
  function put(s) {
    var st = a.style, v = s.charAt(0) === 'b' ? 'bottom' : 'top', side = s.charAt(1);
    st.top = st.bottom = st.left = st.right = 'auto'; st.transform = 'none';
    st[v] = '10px'; st[v] = 'calc(10px + env(safe-area-inset-' + v + ', 0px))';
    if (side === 'c') { st.left = '50%'; st.transform = 'translateX(-50%)'; }
    else { var d = side === 'l' ? 'left' : 'right'; st[d] = '10px'; st[d] = 'calc(10px + env(safe-area-inset-' + d + ', 0px))'; }
  }
  function fixedish(e) {
    for (var n = e; n && n.nodeType === 1; n = n.parentElement) { var p = getComputedStyle(n).position; if (p === 'fixed' || p === 'sticky') return true; }
    return false;
  }
  function place() {
    try {
      var W = document.documentElement.clientWidth, H = window.innerHeight, items = [], all, i, j;
      a.style.pointerEvents = 'none'; all = document.querySelectorAll(SEL);   /* (while measuring, the pill itself must not count as covering anything) */
      for (i = 0; i < all.length; i++) {
        var e = all[i]; if (e === a || a.contains(e) || e.querySelector(SEL)) continue;
        var cs = getComputedStyle(e); if (cs.display === 'none' || cs.visibility === 'hidden' || cs.pointerEvents === 'none') continue;
        var r = e.getBoundingClientRect(); if (r.width < 2 || r.height < 2 || r.bottom <= 0 || r.top >= H || r.right <= 0 || r.left >= W) continue;
        var t = document.elementFromPoint(Math.min(Math.max(r.left + r.width / 2, 0), W - 1), Math.min(Math.max(r.top + r.height / 2, 0), H - 1));
        if (t && !e.contains(t)) continue;   /* hidden behind something else right now (for example scrolled under the footer): not a button the pill can cover */
        items.push({ r: r, hard: fixedish(e) });
      }
      var res = {};
      SPOTS.forEach(function (s) {
        put(s); var b = a.getBoundingClientRect(), hard = 0, soft = 0;
        items.forEach(function (it) { var q = it.r; if (q.left < b.right - 1 && q.right > b.left + 1 && q.top < b.bottom - 1 && q.bottom > b.top + 1) { if (it.hard) hard++; else soft++; } });
        res[s] = { hard: hard, soft: soft };
      });
      var best = '', c = res[cur];
      for (j = 0; j < SPOTS.length; j++) { var x = res[SPOTS[j]]; if (!best || x.hard < res[best].hard || (x.hard === res[best].hard && x.soft < res[best].soft)) best = SPOTS[j]; }
      if (!(c && c.hard === 0 && (c.soft === 0 || res[best].hard > 0 || res[best].soft > 0))) cur = best;
      put(cur); a.style.pointerEvents = '';
    } catch (e) { put(cur || 'bl'); a.style.pointerEvents = ''; }
  }
  function later() { clearTimeout(timer); timer = setTimeout(function () { place(); timer = setTimeout(place, 500); }, 120); }
  put('bc'); cur = 'bc'; place();
  window.addEventListener('resize', later); window.addEventListener('orientationchange', later); window.addEventListener('load', later);
  try { new MutationObserver(function (ms) { for (var i = 0; i < ms.length; i++) if (!a.contains(ms[i].target)) { later(); return; } }).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['class', 'style', 'hidden', 'disabled', 'aria-hidden', 'open'] }); } catch (e) { /* no observer: the spot is only worked out at load and on resize */ }
})()</script></body>
