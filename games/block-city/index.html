<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Block City Times Tables</title>
<meta name="theme-color" content="#2f7dd1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
/* Block City: one idea (the times tables, as rows of blocks) in twelve levels, each adding one new block move.
   Every level: Watch the blocks move, Build it by moving them yourself, then Climb a tower from memory.
   Blocks keep their identity between pictures, so a child SEES them move instead of seeing a new picture. */
:root{
  color-scheme:light;
  --ink:#1d2b4f; --mute:#4a587a; --page:#eaf5ff; --card:#fff; --line:#c9dbef;
  --blue:#2f7dd1; --blue-s:#d5e9ff; --orange:#e8650a; --green:#1f8f45; --green-s:#d3f4dd; --red:#c43a3a; --red-s:#fde0e0; --gold:#ffcc33; --gold-s:#fff5cc;
  --b0:#ff8a3d; --b0d:#c95f18; --b1:#3db0ff; --b1d:#1b7cc2; --b2:#4fc974; --b2d:#2c8f4b;
  --display:"Baloo 2","Nunito","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:800 18px/1.45 var(--body);min-height:100vh}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1}
button{font-family:var(--display);cursor:pointer;color:inherit;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.wrap{max-width:1400px;margin:0 auto;padding:14px 16px 90px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top h1{font-size:clamp(24px,4.5vw,34px);color:var(--blue);margin-right:auto}
.stars{font:800 18px var(--display);color:#8a6400;background:var(--gold-s);border-radius:999px;padding:6px 14px}
.round{border:0;background:#fff;border-radius:999px;min-width:44px;min-height:44px;font-size:20px;box-shadow:0 3px 0 var(--line)}

/* the city: one building for every level finished */
.city{margin-top:12px;border-radius:22px;overflow:hidden;box-shadow:0 6px 0 var(--line);background:#fff}
.city svg{display:block;width:100%;height:auto}
.city .rise{animation:rise .9s cubic-bezier(.2,1.2,.4,1) both;transform-box:fill-box;transform-origin:bottom}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}

.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.tool{border:0;border-radius:18px;min-height:64px;padding:8px 12px;background:var(--gold-s);box-shadow:0 5px 0 #e5cf7c;font-size:19px;color:#6d4f00}

.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:14px;margin-top:16px}
.lv{position:relative;text-align:left;border:0;background:var(--card);border-radius:22px;padding:14px 16px;min-height:118px;box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;gap:4px}
.lv:disabled{opacity:.55;cursor:not-allowed}
.lv.now{outline:4px solid var(--orange);outline-offset:-2px}
.lv b{font:800 21px var(--display);color:var(--blue)}
.lv span{font:700 15px var(--body);color:var(--mute)}
.lv i{font-style:normal;font-size:15px;color:#8a6400;margin-top:auto}
.why{margin-top:18px;background:#fff;border-radius:18px;padding:14px 16px;font:700 15px/1.5 var(--body);color:var(--mute)}
.why b{color:var(--ink)}

/* level screen */
.bar{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.back{border:0;background:#fff;border-radius:14px;min-height:44px;padding:0 14px;font-size:16px;color:var(--blue);box-shadow:0 3px 0 var(--line)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots span{width:13px;height:13px;border-radius:50%;background:#d6e2ef}
.dots span.ok{background:var(--gold)} .dots span.try{background:#9fc3e8}
.dots span.now{outline:3px solid var(--blue);outline-offset:1px}
.panel{margin-top:14px;background:var(--card);border-radius:26px;padding:16px;box-shadow:0 6px 0 var(--line)}
.steps{display:grid;gap:12px;margin-top:12px}
.step{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-radius:18px;padding:12px 14px;min-height:72px;background:var(--blue-s);box-shadow:0 4px 0 #a9c9ea}
.step:disabled{opacity:.5;cursor:not-allowed}
.step.next{background:#ffe2c4;box-shadow:0 4px 0 #e0a877}
.step em{font-style:normal;font-size:30px}
.step b{display:block;font:800 20px var(--display)}
.step small{font:700 15px var(--body);color:var(--mute)}
.goal{font:700 16px/1.45 var(--body);color:var(--mute);margin-top:8px}

.prompt{font:800 clamp(19px,3.4vw,25px)/1.28 var(--display);text-align:center;min-height:2.6em;display:flex;align-items:center;justify-content:center;gap:8px}
.big{font:800 clamp(34px,7vw,50px)/1.1 var(--display);text-align:center;margin:6px 0}
.big u{text-decoration:none;display:inline-block;min-width:1.5em;border-bottom:5px solid var(--blue);color:var(--orange)}
.big u.good{color:var(--green);border-color:var(--green)}
.big u.bad{color:var(--red);border-color:var(--red);animation:shake .35s}
.hint{margin-top:8px;text-align:center;font:700 17px var(--body);color:var(--mute)}
.row{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{border:0;border-radius:16px;min-height:52px;padding:0 22px;font-size:21px;color:#fff;background:var(--orange);box-shadow:0 5px 0 #a5450a}
.btn:active{transform:translateY(2px)}
.btn.alt{background:#fff;color:var(--blue);box-shadow:0 4px 0 var(--line)}
.btn.small{min-height:46px;font-size:18px;padding:0 14px}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* the blocks */
.stage{position:relative;margin:10px auto 0;width:100%;transition:height .35s;user-select:none;-webkit-user-select:none}
.b{position:absolute;left:0;top:0;border-radius:22%;transition:transform .6s cubic-bezier(.3,1.1,.4,1),background .3s,opacity .35s;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.35)}
.b.c0{background:var(--b0)} .b.c1{background:var(--b1)} .b.c2{background:var(--b2)}
.b.ghost{background:transparent;box-shadow:none;border:2px dashed #b3c1d1}
.b.pop{animation:pop .4s ease backwards}
.b.out{opacity:0}
.b.mv{cursor:grab;touch-action:none;animation:nudge 1.2s ease-in-out infinite}
.b.drag{transition:none;animation:none;cursor:grabbing;z-index:5}
.b.loose{cursor:grab;touch-action:none}
.slot{position:absolute;left:0;top:0;border:2px dashed #b3c1d1;border-radius:22%}
@keyframes pop{0%{transform:translate(var(--x),var(--y)) scale(.2)}70%{transform:translate(var(--x),var(--y)) scale(1.12)}100%{transform:translate(var(--x),var(--y)) scale(1)}}
@keyframes nudge{50%{filter:brightness(1.18)}}
@media (prefers-reduced-motion:reduce){.b,.stage{transition-duration:.01s}.b.pop,.b.mv,.city .rise{animation:none}}

/* number pad */
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:12px auto 0}
.pad button{min-height:54px;border:0;border-radius:14px;background:var(--blue-s);color:var(--blue);font-size:26px;box-shadow:0 4px 0 #a9c9ea}
.pad button:active,.pad button.on{transform:translateY(2px);filter:brightness(.9)}

/* the tower */
.climb{display:grid;grid-template-columns:1fr 62px;gap:10px;align-items:stretch}
.tower{display:flex;flex-direction:column-reverse;align-items:center;gap:2px;background:linear-gradient(#eaf5ff,#fff);border-radius:12px;border-bottom:6px solid #c9b48a;padding:4px;min-height:240px}
.floor{width:100%;height:13px;border-radius:4px;animation:drop .45s cubic-bezier(.3,1.3,.5,1) both}
.floor.c0{background:var(--b0)} .floor.c1{background:var(--b1)} .floor.c2{background:var(--b2)}
.floor.soft{opacity:.45}
@keyframes drop{from{transform:translateY(-40px);opacity:0}to{transform:none;opacity:1}}
.clock{text-align:center;font:800 22px var(--display);color:var(--blue)}

/* block lab */
.equation{text-align:center;font:800 clamp(28px,6vw,40px) var(--display);margin:4px 0}
.labbox{position:relative;margin:10px auto 0;background-color:#f6fafe;border-radius:10px;touch-action:pan-y}
.handle{position:absolute;width:44px;height:44px;border-radius:50%;background:#fff;border:3px solid var(--orange);color:var(--orange);display:flex;align-items:center;justify-content:center;font-size:20px;touch-action:none;cursor:nwse-resize;box-shadow:0 3px 8px rgba(0,0,0,.25);z-index:6;margin:-22px 0 0 -22px}
.steppers{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:12px}
.stepper{display:flex;align-items:center;gap:6px;font:800 16px var(--display)}
.stepper button{width:44px;height:44px;border:0;border-radius:12px;background:var(--blue-s);color:var(--blue);font-size:24px;box-shadow:0 3px 0 #a9c9ea}

/* the times table map */
.chartwrap{overflow-x:auto}
.chart{border-collapse:separate;border-spacing:3px;margin:10px auto 0;width:100%;max-width:520px;table-layout:fixed}
.chart th{font:800 15px var(--display);color:var(--mute)}
.chart td{padding:0}
.chart button{width:100%;aspect-ratio:1;min-height:28px;border:0;border-radius:7px;background:#e6edf5;color:var(--mute);font:800 clamp(12px,2.6vw,17px) var(--display);padding:0}
.chart button.seen{background:var(--blue-s);color:var(--blue)}
.chart button.known{background:var(--gold);color:#5f4500}
.done{text-align:center}
.done .big-e{font-size:60px}

/* rewards the child types: a page of star goals, and a corner badge showing the next one */
.rchip{margin-left:auto;max-width:min(100%,420px);padding:8px 14px;border-radius:999px;background:var(--gold-s);border:2px solid var(--gold);color:#6d4f00;font:800 17px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv .rcorner{position:absolute;top:-8px;right:10px;max-width:70%;padding:3px 10px;border-radius:999px;background:var(--gold);color:#5f4500;font:800 13px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rlist{display:grid;gap:12px;margin-top:14px}
.rrow{display:grid;grid-template-columns:78px minmax(0,1fr) 104px;align-items:center;gap:10px}
.rrow b{font:800 22px var(--display);color:#8a6400}
.rrow input{width:100%;min-height:56px;padding:0 14px;border:3px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font:800 20px var(--body)}
.rrow input:focus{outline:0;border-color:var(--orange)}
.rrow span{font:800 15px var(--display);color:var(--mute);text-align:right}
.rrow.won{background:var(--gold-s);border-radius:16px;padding:6px 8px}
.rrow.won span{color:var(--green)}
@media (max-width:520px){.rrow{grid-template-columns:64px minmax(0,1fr)}.rrow span{grid-column:2;text-align:left}}
.earned{margin:10px auto 0;max-width:640px;padding:12px 16px;border-radius:16px;background:var(--gold-s);border:3px solid var(--gold);font:800 22px var(--display);color:#6d4f00}

/* tablets and computers: bigger words and buttons. The blocks grow in Stage's fit() */
@media (min-width:700px){
  .prompt{font-size:30px}
  .big{font-size:60px}
  .hint{font-size:20px}
  .btn{min-height:64px;padding:0 30px;font-size:26px}
  .btn.small{min-height:56px;font-size:22px}
  .back{min-height:52px;font-size:20px}
  .pad{width:100%;max-width:360px}
  .pad button{min-height:68px;font-size:32px}
  .city svg{max-height:34vh}
  .chart{max-width:760px}
}
/* a wide screen: blocks on the left, answer keys on the right, so both fit without scrolling */
@media (min-width:900px) and (orientation:landscape){
  .split{display:grid;grid-template-columns:minmax(0,1fr) 360px;column-gap:20px;align-items:start}
  .split > *{grid-column:2}
  .split > .prompt{grid-column:1 / -1}
  .split > .stagebox{grid-column:1;grid-row:2 / span 8}
}
</style>

<div class="wrap">
  <div class="top"><h1>🧱 Block City</h1><span class="pill-slot" data-pill-slot></span>

<script>

  /* The block between these two marks has no page code in it: 网站\voice-lines.cjs runs it to list every sentence for recording. */

    if (r === 6) { v = 5 * c; return { spec: grid(6, c, [{ n: 5 }, { n: 1 }]), line: '5 rows of ' + c + ' is ' + v + '. Add one more row of ' + c + '.' }; }

    hub: 'First watch the blocks. Then build it yourself. Then climb the tower.',

    built: 'Great building! Now climb the tower.',
    moveRow: 'Drag the new row onto the blocks.',

    quick: 'Quick Climb done! Try to beat your own time.'

    { name: 'Equal Rows', goal: 'What × means', blurb: '3 × 4 means 3 rows of 4 blocks. Move loose blocks into rows.',

      facts: [[1, 4], [1, 6], [2, 3], [2, 5], [3, 2], [3, 4], [2, 4], [3, 3], [1, 8], [3, 5], [2, 2], [2, 6]],
