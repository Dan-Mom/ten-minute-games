<!doctype html>
<html lang="en">
<head><script>/* Ten-Minute Games accounts: a parent signs in with Google, adds children by nickname, and each child's game progress follows them
   to any computer or iPad. Signing in is optional; without it every game works exactly as before (progress stays on this device).

   How progress is kept: every game already saves its progress in this browser (localStorage) under its own names. This script,
   which build.cjs puts at the very top of every page, keeps one copy of those values per player ("guest" = not signed in, or a
   child). When the player changes, the values in the browser are swapped before the game reads them. When a child is playing,
   their copy is also saved to Firebase (Firestore: families/<parent uid>/kids/<child id>), and loaded back on other devices.
   Only values written by these game pages are kept; nothing else in the browser is read or sent.

   Public Firebase web config: allowed on the public site by PRIVACY-RULE.md exception five. Access is guarded by the Firestore
   rules (each parent can only read and write their own family), not by hiding this. */
(function () {
  'use strict';
  if (window.TMG) return;
  var CONFIG = {
    apiKey: 'AIzaSyDC-kbJIExCfhIsUkkShVIO8VtBTe3D7WI',
    authDomain: 'ten-minute-games.firebaseapp.com',
    projectId: 'ten-minute-games',
    storageBucket: 'ten-minute-games.firebasestorage.app',
    messagingSenderId: '448551703283',
    appId: '1:448551703283:web:7f0c2b75a166f1fcbb1d86'
  };
  var SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
  var P = 'tmg.', GUEST = 'guest', MAX_VALUE = 200000;
  var LS; try { LS = window.localStorage; LS.getItem(P + 'x'); } catch (e) { LS = null; }
  if (!LS) { window.TMG = { kid: GUEST, ready: Promise.resolve(), mountHome: function () {} }; return; }
  var rawSet = Storage.prototype.setItem, rawRemove = Storage.prototype.removeItem, rawGet = Storage.prototype.getItem;
  function get(k) { return rawGet.call(LS, k); }
  function put(k, v) { try { rawSet.call(LS, k, v); } catch (e) {} }
  function del(k) { rawRemove.call(LS, k); }
  function J(k, d) { try { var v = get(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function W(k, o) { put(k, JSON.stringify(o)); }
  function ours(k) { return typeof k === 'string' && (k.indexOf(P) === 0 || k.indexOf('firebase') === 0); }

  function current() { return get(P + 'current') || GUEST; }
  function store(id) { return J(P + 'kid.' + id, { data: {}, updated: 0 }); }
  function saveStore(id, s) { W(P + 'kid.' + id, s); }
  function known() { return J(P + 'known', []); }

  /* Put player `id`'s values into the browser. The values sitting there now belong to `owner`: keep them first. */
  function swap() {
    var id = current(), owner = get(P + 'owner') || GUEST;
    if (owner === id) return false;
    var ks = known(), from = store(owner), to = store(id), changed = false;
    ks.forEach(function (k) { var v = get(k); if (v === null) delete from.data[k]; else from.data[k] = v; });
    saveStore(owner, from);
    ks.forEach(function (k) {
      var want = Object.prototype.hasOwnProperty.call(to.data, k) ? to.data[k] : null;
      if (get(k) !== want) { changed = true; if (want === null) del(k); else put(k, want); }
    });
    put(P + 'owner', id);
    return changed;
  }
  swap();

  /* Every write a game makes is copied into the current player's store. For a child, the name is also listed under `changed` until it has reached the cloud.
     Until this page has heard from the cloud, writes only wait: a game saving as it opens must not make an out-of-date device look newest. */
  var dirtyTimer = 0, syncing = false, waiting = {}, onHome = !!document.querySelector('meta[name="tmg-home"]');
  if (get(P + 'dirty') === '1') {          // left by an older version of this script: everything this child has here may be unsent
    if (current() !== GUEST) { var old = store(current()); old.changed = {}; Object.keys(old.data).forEach(function (k) { old.changed[k] = 1; }); saveStore(current(), old); }
    del(P + 'dirty');
  }
  function later() { clearTimeout(dirtyTimer); dirtyTimer = setTimeout(function () { cloud.push(); }, 3000); }
  function noteWrite(k, v) {
    if (ours(k)) return;
    if (v !== null && String(v).length > MAX_VALUE) return;
    var ks = known(); if (ks.indexOf(k) < 0) { ks.push(k); W(P + 'known', ks); }
    var id = current(), s = store(id), had = Object.prototype.hasOwnProperty.call(s.data, k) ? s.data[k] : null;
    if (had === (v === null ? null : String(v))) return;   // nothing new
    if (v === null) delete s.data[k]; else s.data[k] = String(v);
    if (id === GUEST) { s.updated = Date.now(); saveStore(id, s); return; }
    if (syncing) { waiting[k] = 1; saveStore(id, s); return; }
    (s.changed = s.changed || {})[k] = 1; s.updated = Date.now(); saveStore(id, s);
    later();
  }
  Storage.prototype.setItem = function (k, v) { rawSet.call(this, k, v); if (this === LS) noteWrite(String(k), String(v)); };
  Storage.prototype.removeItem = function (k) { rawRemove.call(this, k); if (this === LS) noteWrite(String(k), null); };
  /* the writes that were waiting now count as this child's changes */
  function settle() {
    syncing = false;
    var ks = Object.keys(waiting), id = current(); waiting = {};
    if (!ks.length || id === GUEST) return;
    var s = store(id); s.changed = s.changed || {};
    ks.forEach(function (k) { s.changed[k] = 1; });
    s.updated = Date.now(); saveStore(id, s); later();
  }
  function reloadPage() {
    try {
      var flag = 'tmg.reloaded.' + location.pathname, last = Number(sessionStorage.getItem(flag)) || 0;
      if (Date.now() - last > 30000) { sessionStorage.setItem(flag, String(Date.now())); location.reload(); }
    } catch (e) {}
  }
  /* A child's copies on this device: progress and the reward words. */
  function dropKid(id) {
    del(P + 'kid.' + id);
    var end = '.rewards.' + id;
    Object.keys(LS).forEach(function (k) { if (k.indexOf(P) === 0 && k.slice(-end.length) === end) del(k); });
  }
  /* The child was removed on another device: this device lets go too, and never writes them back. */
  function childGone(id) {
    if (current() === id) { put(P + 'current', GUEST); swap(); }
    dropKid(id);
    var fam = J(P + 'family', null);
    if (fam && fam.kids) { fam.kids = fam.kids.filter(function (k) { return k.id !== id; }); W(P + 'family', fam); }
  }

  /* ---------- Firebase (loaded only when it is needed) ---------- */
  var fb = null;
  function loadScript(src) { return new Promise(function (ok, no) { var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }
  function firebaseReady() {
    if (fb) return fb;
    fb = loadScript(SDK + 'firebase-app-compat.js')
      .then(function () { return Promise.all([loadScript(SDK + 'firebase-auth-compat.js'), loadScript(SDK + 'firebase-firestore-compat.js')]); })
      .then(function () {
        var app = window.firebase.apps.length ? window.firebase.app() : window.firebase.initializeApp(CONFIG);
        return { auth: app.auth(), db: app.firestore() };
      });
    return fb;
  }
  function userNow(f) { return new Promise(function (ok) { var off = f.auth.onAuthStateChanged(function (u) { off(); ok(u); }); }); }
  function kidsRef(f, uid) { return f.db.collection('families').doc(uid).collection('kids'); }

  var cloud = {
    /* upload a child's copy if it has changes. true = nothing is left unsent. `update`, not `set`: it fails on a child who has been removed instead of bringing them back. */
    push: function (id) {
      id = id || current();
      var uid = get(P + 'uid');
      if (id === GUEST || !uid) return Promise.resolve(true);
      if (syncing && id === current()) return ready.then(function () { return cloud.push(id); });
      var s = store(id);
      if (!Object.keys(s.changed || {}).length) return Promise.resolve(true);
      var name = (J(P + 'family', { kids: [] }).kids.filter(function (k) { return k.id === id; })[0] || {}).name || 'Player';
      if (JSON.stringify(s.data).length > 900000) return Promise.resolve(false);   // a Firestore document holds at most 1 MB: keep it on this device only
      return firebaseReady().then(function (f) {
        return kidsRef(f, uid).doc(id).update({ name: name, data: s.data, updated: s.updated || Date.now() });
      }).then(function () {
        var now = store(id);
        now.base = s.updated;   // the cloud now holds this version
        if (now.updated === s.updated) now.changed = {};
        saveStore(id, now);
        return true;
      }, function (e) {
        if (e && e.code === 'not-found') { childGone(id); if (!onHome) reloadPage(); return true; }
        return false;
      });
    },
    /* compare with the cloud; returns true when the values in the browser changed */
    pull: function () {
      var id = current(), uid = get(P + 'uid');
      if (id === GUEST || !uid) return Promise.resolve(false);
      return firebaseReady().then(function (f) { return kidsRef(f, uid).doc(id).get(); }).then(function (doc) {
        if (!doc.exists) { childGone(id); return true; }
        var c = doc.data(), s = store(id), cu = c.updated || 0, mine = s.changed || {};
        var news = s.base != null ? cu !== s.base : cu > (s.updated || 0);   // has the cloud changed since this device last synced?
        if (!news) {
          if (cu < (s.updated || 0) && !Object.keys(mine).length) { s.changed = {}; Object.keys(s.data).forEach(function (k) { s.changed[k] = 1; }); saveStore(id, s); }
          return false;
        }
        /* the cloud is newer: take it, keeping only what this device changed and has not sent yet */
        var data = JSON.parse(JSON.stringify(c.data || {})), mineKeys = Object.keys(mine);
        mineKeys.forEach(function (k) { if (Object.prototype.hasOwnProperty.call(s.data, k)) data[k] = s.data[k]; else delete data[k]; });
        saveStore(id, { data: data, updated: mineKeys.length ? Math.max(Date.now(), cu + 1) : cu, changed: mine, base: cu });
        waiting = {};
        var ks = known(); Object.keys(data).forEach(function (k) { if (ks.indexOf(k) < 0) ks.push(k); }); W(P + 'known', ks);
        var changed = false;
        if ((get(P + 'owner') || GUEST) === id) ks.forEach(function (k) {
          var want = Object.prototype.hasOwnProperty.call(data, k) ? data[k] : null;
          if (get(k) !== want) { changed = true; if (want === null) del(k); else put(k, want); }
        });
        return changed;
      }, function () { return false; });
    }
  };
  /* hear from the cloud, then send whatever is left to send */
  function syncNow() {
    syncing = true;
    setTimeout(function () { if (syncing) settle(); }, 20000);   // no answer for this long: what the child has been doing counts
    return cloud.pull().then(function (changed) { settle(); cloud.push(); return changed; });
  }
  window.addEventListener('pagehide', function () { cloud.push(); });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') cloud.push(); });

  /* On a game page with a child playing: fetch their newest progress; if it differs from what the game already read, reload. */
  var ready = Promise.resolve();
  if (get(P + 'uid') && current() !== GUEST) {
    ready = syncNow().then(function (changed) { if (changed && !onHome) reloadPage(); });
  }

  /* ---------- the parent panel on the home page ---------- */
  function E(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function newId() { var a = new Uint8Array(9); crypto.getRandomValues(a); return Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join(''); }
  function cleanName(s) { return String(s || '').replace(/[<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, 20); }

  function mountHome(box) {
    var msg = '';
    function render() {
      box.replaceChildren();
      var uid = get(P + 'uid'), fam = J(P + 'family', { kids: [] }), cur = current();
      if (!uid) {
        var b = E('button', 'acct-btn', 'Parent sign-in'); b.type = 'button'; b.onclick = signIn;
        box.appendChild(b);
        box.appendChild(E('span', 'acct-note', 'Optional: keep each child’s progress on every device.'));
      } else {
        var row = E('div', 'acct-kids');
        fam.kids.forEach(function (k) {
          var chip = E('button', 'acct-kid' + (k.id === cur ? ' on' : ''), (k.id === cur ? '▶ ' : '') + k.name); chip.type = 'button';
          chip.setAttribute('aria-pressed', k.id === cur ? 'true' : 'false');
          chip.onclick = function () { choose(k.id); };
          row.appendChild(chip);
        });
        var g = E('button', 'acct-kid' + (cur === GUEST ? ' on' : ''), 'Just looking'); g.type = 'button'; g.onclick = function () { choose(GUEST); };
        row.appendChild(g);
        var add = E('button', 'acct-btn small', '+ Add child'); add.type = 'button'; add.onclick = addKid;
        row.appendChild(add);
        box.appendChild(row);
        var tools = E('span', 'acct-tools');   // on the same row, right after "+ Add child"
        var so = E('button', 'acct-link', 'Sign out'); so.type = 'button'; so.onclick = signOut; tools.appendChild(so);
        var rm = E('button', 'acct-link', 'Remove a child'); rm.type = 'button'; rm.onclick = removeKid; tools.appendChild(rm);
        var dl = E('button', 'acct-link danger', 'Delete account and all data'); dl.type = 'button'; dl.onclick = deleteAll; tools.appendChild(dl);
        var pv = E('a', 'acct-link', 'Privacy'); pv.href = 'privacy.html'; tools.appendChild(pv);
        row.appendChild(tools);
      }
      if (msg) box.appendChild(E('div', 'acct-msg', msg));
    }
    function say(t) { msg = t; render(); }
    function loadFamily(f, uid) {
      return kidsRef(f, uid).get().then(function (q) {
        var kids = []; q.forEach(function (d) { kids.push({ id: d.id, name: cleanName(d.data().name) || 'Player' }); });
        kids.sort(function (a, b) { return a.name.localeCompare(b.name); });
        var before = J(P + 'family', { kids: [] }).kids;
        W(P + 'family', { kids: kids });
        if (current() !== GUEST && !kids.some(function (k) { return k.id === current(); })) { put(P + 'current', GUEST); swap(); }
        before.forEach(function (o) { if (!kids.some(function (k) { return k.id === o.id; })) dropKid(o.id); });
        return kids;
      });
    }
    function signIn() {
      say('Opening Google sign-in…');
      firebaseReady().then(function (f) {
        var p = new window.firebase.auth.GoogleAuthProvider();
        return f.auth.signInWithPopup(p).then(function (r) { put(P + 'uid', r.user.uid); return loadFamily(f, r.user.uid); });
      }).then(function (kids) { msg = kids.length ? 'Signed in. Pick who is playing.' : 'Signed in. Add your first child (a nickname is enough).'; render(); },
        function (e) { say(e && e.code === 'auth/popup-closed-by-user' ? '' : 'Sign-in did not work' + (e && e.code ? ' (' + e.code + ')' : '') + '. Please try again.'); });
    }
    function addKid() {
      var name = cleanName(window.prompt('Child’s nickname (not their full name):', ''));
      if (!name) return;
      var uid = get(P + 'uid'), id = newId(), fam = J(P + 'family', { kids: [] });
      var guest = store(GUEST), first = fam.kids.length === 0 && Object.keys(guest.data).length > 0;
      var start = { data: {}, updated: Date.now() };
      if (first && window.confirm('Move the progress already on this device to ' + name + '?')) {
        swap(); start = { data: JSON.parse(JSON.stringify(store(GUEST).data)), updated: Date.now() };
      }
      say('Adding ' + name + '…');
      firebaseReady().then(function (f) {
        return kidsRef(f, uid).doc(id).set({ name: name, data: start.data, updated: start.updated }).then(function () { return loadFamily(f, uid); });
      }).then(function () { start.base = start.updated; saveStore(id, start); choose(id); }, function () { say('Could not add ' + name + '. Please try again.'); });
    }
    function choose(id) {
      cloud.push().then(function () {
        put(P + 'current', id); swap();
        msg = id === GUEST ? 'Just looking: progress stays on this device.' : 'Now playing: ' + ((J(P + 'family', { kids: [] }).kids.filter(function (k) { return k.id === id; })[0] || {}).name || '');
        render();
        if (id !== GUEST) ready = syncNow();
      });
    }
    function removeKid() {
      var fam = J(P + 'family', { kids: [] }); if (!fam.kids.length) return;
      var name = window.prompt('Type the nickname of the child to remove. Their progress is deleted everywhere.\n\n' + fam.kids.map(function (k) { return k.name; }).join(', '), '');
      var k = fam.kids.filter(function (x) { return x.name === cleanName(name); })[0]; if (!k) return;
      var uid = get(P + 'uid');
      firebaseReady().then(function (f) { return kidsRef(f, uid).doc(k.id).delete().then(function () { return loadFamily(f, uid); }); })
        .then(function () { dropKid(k.id); say(k.name + ' was removed.'); }, function () { say('Could not remove ' + k.name + '. Please try again.'); });
    }
    /* leave this device as a guest device: the children's copies are taken off it. keepUnsent keeps any copy that has not reached the cloud yet. */
    function forgetDevice(keepUnsent) {
      put(P + 'current', GUEST); swap();
      J(P + 'family', { kids: [] }).kids.forEach(function (k) {
        if (keepUnsent && Object.keys(store(k.id).changed || {}).length) return;
        del(P + 'kid.' + k.id);
      });
      if (!keepUnsent) del(P + 'family');
      del(P + 'uid');
    }
    /* never sign out while something has not reached the cloud: signing out takes the only copy off this device */
    function signOut() {
      var ids = J(P + 'family', { kids: [] }).kids.map(function (k) { return k.id; });
      say('Saving…');
      ready.then(function () { return Promise.all(ids.map(function (id) { return cloud.push(id); })); }).then(function (done) {
        if (done.indexOf(false) >= 0) { say('Not signed out: some progress has not been saved yet. Check the internet and try again.'); return; }
        return firebaseReady().then(function (f) { return f.auth.signOut(); }).then(function () { forgetDevice(); say('Signed out. This device is back to guest play.'); },
          function () { forgetDevice(); say('Signed out on this device.'); });
      });
    }
    function deleteAll() {
      if (!window.confirm('Delete your account, all your children and all their progress? This cannot be undone.')) return;
      var uid = get(P + 'uid');
      say('Deleting…');
      firebaseReady().then(function (f) {
        return kidsRef(f, uid).get().then(function (q) { var jobs = []; q.forEach(function (d) { jobs.push(d.ref.delete()); }); return Promise.all(jobs); })
          .then(function () { var u = f.auth.currentUser; return u.delete().catch(function (e) {
            if (e && e.code === 'auth/requires-recent-login') return u.reauthenticateWithPopup(new window.firebase.auth.GoogleAuthProvider()).then(function () { return u.delete(); });
            throw e; }); });
      }).then(function () { var ids = J(P + 'family', { kids: [] }).kids.map(function (k) { return k.id; }); forgetDevice(); ids.forEach(dropKid); say('Your account and all its data were deleted.'); },
        function () { say('Could not finish deleting. Please sign in again and retry.'); });
    }
    /* check the sign-in is still valid (it can end on another device) */
    if (get(P + 'uid')) firebaseReady().then(function (f) { return userNow(f).then(function (u) {
      if (!u) { forgetDevice(true); render(); return; }
      return loadFamily(f, u.uid).then(render);
    }); }, function () {});
    render();
  }

  window.TMG = { kid: current(), ready: ready, mountHome: mountHome, _swap: swap, _cloud: cloud };
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Apple Crates</title>
<meta name="theme-color" content="#c8452f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
/* Apple Crates: one idea (adding and taking away, using tens and ones) in nine levels, each adding one new thing.
   A crate holds 10 apples. Adding can fill a new crate; taking away can open one. The child does this with their own fingers
   before answering from memory, so regrouping is something they have done, not a rule they were told. */
:root{
  color-scheme:light;
  --ink:#3b2417; --mute:#6d5748; --page:#fff4e6; --card:#fff; --line:#ecd9c3;
  --red:#c8452f; --orange:#e8650a; --green:#1f8f45; --bad:#c43a3a; --gold:#ffcc33; --gold-s:#fff5cc; --soft:#ffe9d2; --wood:#b9824c; --wood-s:#f6dfc0;
  --display:"Baloo 2","Nunito","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:800 18px/1.45 var(--body);min-height:100vh}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1}
button{font-family:var(--display);cursor:pointer;color:inherit;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.wrap{max-width:1400px;margin:0 auto;padding:14px 16px 90px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top h1{font-size:clamp(24px,4.5vw,34px);color:var(--red);margin-right:auto}
.stars{font:800 18px var(--display);color:#8a6400;background:var(--gold-s);border-radius:999px;padding:6px 14px}
.round{border:0;background:#fff;border-radius:999px;min-width:44px;min-height:44px;font-size:20px;box-shadow:0 3px 0 var(--line)}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.tool{border:0;border-radius:18px;min-height:64px;padding:8px 12px;background:var(--gold-s);box-shadow:0 5px 0 #e5cf7c;font-size:19px;color:#6d4f00}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:14px;margin-top:16px}
.lv{position:relative;text-align:left;border:0;background:var(--card);border-radius:22px;padding:14px 16px;min-height:118px;box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;gap:4px}
.lv:disabled{opacity:.55;cursor:not-allowed}
.lv.now{outline:4px solid var(--orange);outline-offset:-2px}
.lv b{font:800 21px var(--display);color:var(--red)}
.lv span{font:700 15px var(--body);color:var(--mute)}
.lv i{font-style:normal;font-size:15px;color:#8a6400;margin-top:auto}
.why{margin-top:18px;background:#fff;border-radius:18px;padding:14px 16px;font:700 15px/1.5 var(--body);color:var(--mute)}
.why b{color:var(--ink)}
.bar{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.back{border:0;background:#fff;border-radius:14px;min-height:44px;padding:0 14px;font-size:16px;color:var(--red);box-shadow:0 3px 0 var(--line)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots span{width:13px;height:13px;border-radius:50%;background:#e7dccf}
.dots span.ok{background:var(--gold)} .dots span.try{background:#e0b98f}
.dots span.now{outline:3px solid var(--red);outline-offset:1px}
.panel{margin-top:14px;background:var(--card);border-radius:26px;padding:16px;box-shadow:0 6px 0 var(--line)}
.steps{display:grid;gap:12px;margin-top:12px}
.step{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-radius:18px;padding:12px 14px;min-height:72px;background:var(--soft);box-shadow:0 4px 0 #e6c49d}
.step:disabled{opacity:.5;cursor:not-allowed}
.step.next{background:#ffd9ae;box-shadow:0 4px 0 #e0a877}
.step em{font-style:normal;font-size:30px}
.step b{display:block;font:800 20px var(--display)}
.step small{font:700 15px var(--body);color:var(--mute)}
.goal{font:700 16px/1.45 var(--body);color:var(--mute);margin-top:8px}
.prompt{font:800 clamp(19px,3.4vw,25px)/1.28 var(--display);text-align:center;min-height:2.6em;display:flex;align-items:center;justify-content:center;gap:8px}
.big{font:800 clamp(34px,7vw,50px)/1.1 var(--display);text-align:center;margin:6px 0}
.big u{text-decoration:none;display:inline-block;min-width:1.5em;border-bottom:5px solid var(--red);color:var(--orange)}
.big u.good{color:var(--green);border-color:var(--green)}
.big u.bad{color:var(--bad);border-color:var(--bad);animation:shake .35s}
.hint{margin-top:8px;text-align:center;font:700 17px var(--body);color:var(--mute)}
.row{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{border:0;border-radius:16px;min-height:52px;padding:0 22px;font-size:21px;color:#fff;background:var(--orange);box-shadow:0 5px 0 #a5450a}
.btn:active{transform:translateY(2px)}
.btn.alt{background:#fff;color:var(--red);box-shadow:0 4px 0 var(--line)}
.btn.small{min-height:46px;font-size:18px;padding:0 14px}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* the apples */
.stall{display:flex;flex-direction:column;gap:14px;align-items:center;--a:40px}
.lot{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:flex-start;border:0;background:none;padding:6px;border-radius:18px;width:100%;transition:transform .45s cubic-bezier(.3,1.1,.4,1)}
.lot.tapme{outline:4px dashed #58b76f;outline-offset:-2px;cursor:pointer}
.crate{display:grid;grid-template-columns:repeat(5,var(--a));gap:0;padding:6px;border:0;border-radius:10px;background:var(--wood-s);box-shadow:inset 0 0 0 4px var(--wood),0 3px 0 #8d6236}
.crate.tapme{cursor:pointer;box-shadow:inset 0 0 0 4px var(--orange),0 3px 0 #a5450a}
.loose{display:grid;grid-template-columns:repeat(5,var(--a));gap:0;padding:6px;border-radius:10px;align-content:start}
.ap{display:flex;align-items:center;justify-content:center;width:var(--a);height:var(--a);font-size:calc(var(--a) * .82);line-height:1;border:0;background:none;padding:0}
button.ap{cursor:pointer;border-radius:50%}
button.ap.tapme{box-shadow:0 0 0 3px #f4b183}
.pop{animation:pop .35s ease backwards}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.lot{transition-duration:.01s}.pop{animation:none}}
.left{font:800 22px var(--display);color:var(--orange);text-align:center;margin-top:6px}

/* number pad */
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:12px auto 0}
.pad button{min-height:54px;border:0;border-radius:14px;background:var(--soft);color:var(--red);font-size:26px;box-shadow:0 4px 0 #e6c49d}
.pad button:active,.pad button.on{transform:translateY(2px);filter:brightness(.92)}
.done{text-align:center}
.done .big-e{font-size:60px}

/* rewards the child types */
.rchip{margin-left:auto;max-width:min(100%,420px);padding:8px 14px;border-radius:999px;background:var(--gold-s);border:2px solid var(--gold);color:#6d4f00;font:800 17px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv .rcorner{position:absolute;top:-8px;right:10px;max-width:70%;padding:3px 10px;border-radius:999px;background:var(--gold);color:#5f4500;font:800 13px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rlist{display:grid;gap:12px;margin-top:14px}
.rrow{display:grid;grid-template-columns:78px minmax(0,1fr) 104px;align-items:center;gap:10px}
.rrow b{font:800 22px var(--display);color:#8a6400}
.rrow input{width:100%;min-height:56px;padding:0 14px;border:3px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font:800 20px var(--body)}
.rrow input:focus{outline:0;border-color:var(--orange)}
.rrow span{font:800 15px var(--display);color:var(--mute);text-align:right}
.rrow.won{background:var(--gold-s);border-radius:16px;padding:6px 8px}
.rrow.won span{color:var(--green)}
@media (max-width:520px){.rrow{grid-template-columns:64px minmax(0,1fr)}.rrow span{grid-column:2;text-align:left}}
.earned{margin:10px auto 0;max-width:640px;padding:12px 16px;border-radius:16px;background:var(--gold-s);border:3px solid var(--gold);font:800 22px var(--display);color:#6d4f00}

/* tablets and computers: bigger words and buttons */
@media (min-width:700px){
  .prompt{font-size:30px}
  .big{font-size:60px}
  .hint{font-size:20px}
  .btn{min-height:64px;padding:0 30px;font-size:26px}
  .btn.small{min-height:56px;font-size:22px}
  .back{min-height:52px;font-size:20px}
  .pad{width:100%;max-width:360px}
  .pad button{min-height:68px;font-size:32px}
}
/* a wide screen: apples on the left, answer keys on the right, so both fit without scrolling */
@media (min-width:900px) and (orientation:landscape){
  .split{display:grid;grid-template-columns:minmax(0,1fr) 360px;column-gap:20px;align-items:start}
  .split > *{grid-column:2}
  .split > .prompt{grid-column:1 / -1}
  .split > .stallbox{grid-column:1;grid-row:2 / span 8}
}
</style>

<body>
<div class="wrap">
  <div class="top"><h1>🍎 Apple Crates</h1><span class="pill-slot" data-pill-slot></span>
    <button class="round" id="snd" type="button" aria-label="Read it to me again">🔊</button>
    <button class="round" id="mute" type="button" aria-label="Turn the voice off">🗣️</button>
    <span class="stars" id="starTotal">⭐ 0</span></div>
  <div id="app"></div>

<script>
(function () {
  "use strict";
  /* The block between these two marks has no page code in it: 网站\voice-lines.cjs runs it to list every sentence for recording. */
  /*LINES-BEGIN*/
  var MINUS = '−';
  function A(a, b) { return { k: 'add', a: a, b: b }; }

  var SAY = {
    home: 'Pick a level. The orange one is next.',
    hub: 'First watch. Then play with the apples.',
    bring: 'Tap the green apples to bring them over.',
    pack: 'Ten loose apples fill a crate. Tap Pack a crate.',
    howMany: 'How many apples now?',

    crate: 'A crate is 10. Tap a crate to sell it.',

    open: 'Not enough loose apples. Tap a crate to open it.',
    memory: 'Now from memory. If you need help, tap Show the apples.',
    hintAdd: 'Add the crates first. Then add the loose apples. Ten loose apples make a crate.',
    hintSub: 'Take away the crates first. Then the loose apples. Open a crate if you need more.',

    hintFact: 'The two small numbers make the big number.',
    hintCount: 'Count the crates by tens. Then add the loose apples.'

  /* apples: r = red, g = green. A picture is { c: crates, l: loose, gc: green crates, gl: green loose apples, below: true if the green ones wait in their own row } */
  var LEVELS = [
    { name: 'Put Together', goal: 'Adding', blurb: 'Bring two groups together and say how many.',
      demo: [{ say: 'Here are 3 red apples.', pic: { l: 3 } }, { say: 'Here come 2 green apples.', pic: { l: 3, gl: 2, below: true } }, { say: 'Put them together: 5 apples. 3 + 2 = 5.', pic: { l: 3, gl: 2 } }],

    { name: 'Take Away', goal: 'Taking away', blurb: 'Sell some apples and say how many are left.',

    { name: 'Add Big Numbers', goal: 'Adding tens and ones', blurb: 'Crates with crates, loose apples with loose apples. 23 + 14 = 37.',

      items: pairs(A, [[23, 14], [31, 25], [42, 16], [15, 32], [24, 23], [51, 38], [36, 42], [12, 45], [60, 27], [33, 33]]), hint: 'hintAdd' },
    { name: 'Sell Big Numbers', goal: 'Taking away tens and ones', blurb: 'Sell crates, then loose apples. 37 − 14 = 23.',
      demo: [{ say: 'Here are 37 apples.', pic: { c: 3, l: 7 } }, { say: 'Sell 14: first sell a crate. That is 10.', pic: { c: 2, l: 7 } }, { say: 'Then sell 4 loose apples.', pic: { c: 2, l: 3 } }, { say: 'That leaves 23. 37 ' + MINUS + ' 14 = 23.', pic: { c: 2, l: 3 } }],
      items: pairs(S, [[37, 14], [48, 25], [56, 32], [69, 41], [58, 23], [66, 40], [38, 15], [67, 34], [59, 27], [47, 23]]), hint: 'hintSub' },
    { name: 'Pack a Crate', goal: 'Adding with a new ten', blurb: '10 loose apples fill a new crate. 27 + 15 = 42.',
      demo: [{ say: 'Here are 27 apples and 15 more.', pic: { c: 2, l: 7, gc: 1, gl: 5, below: true } }, { say: 'Together there are 12 loose apples.', pic: { c: 2, gc: 1, l: 7, gl: 5 } }, { say: 'Ten of them fill a crate.', pic: { c: 4, gl: 2 } }, { say: 'Now 4 crates and 2 loose: 42. 27 + 15 = 42.', pic: { c: 4, gl: 2 } }],
      items: pairs(A, [[27, 15], [38, 24], [19, 13], [46, 28], [35, 17], [29, 36], [18, 44], [57, 26], [48, 35], [16, 19]]), hint: 'hintAdd' },
    { name: 'Open a Crate', goal: 'Taking away with a ten opened', blurb: 'Not enough loose apples? Open a crate. 42 − 17 = 25.',
      demo: [{ say: 'Here are 42 apples. Sell 17.', pic: { c: 4, l: 2 } }, { say: 'Sell a crate: that is 10. 7 more to sell.', pic: { c: 3, l: 2 } }, { say: 'Only 2 loose apples. Open a crate.', pic: { c: 3, l: 2 } }, { say: 'Now 12 loose apples. Sell 7.', pic: { c: 2, l: 12 } }, { say: 'That leaves 25. 42 ' + MINUS + ' 17 = 25.', pic: { c: 2, l: 5 } }],
      items: pairs(S, [[42, 17], [33, 15], [51, 24], [60, 28], [45, 19], [62, 35], [34, 16], [53, 27], [41, 23], [64, 38]]), hint: 'hintSub' },
    { name: 'Market Day', goal: 'All of it, mixed', blurb: 'Plus or minus? Look at the sign first.',
      demo: [{ say: 'Now it is all mixed up.', pic: { c: 2, l: 4 } }, { say: 'Look at the sign first: plus or minus?', pic: { c: 2, l: 4 } }],
      items: [A(24, 35), S(56, 23), A(37, 25), S(43, 18), A(19, 32), S(61, 26), A(45, 41), S(78, 35), A(28, 28), S(50, 14)], hintBy: true }
  ];
  function hintFor(lv, q) { var d = LEVELS[lv]; return SAY[d.hintBy ? (q.k === 'add' ? 'hintAdd' : 'hintSub') : d.hint]; }
  function allLines() {
    var out = Object.keys(SAY).map(function (k) { return SAY[k]; });
    LEVELS.forEach(function (d, lv) {
      d.demo.forEach(function (x) { out.push(x.say); });
      for (var n = 1; n <= 3; n++) out.push(doneLine(lv, n));
      d.items.forEach(function (q) { out.push(qLine(q)); out.push(aLine(q)); if (q.k === 'sub') out.push(sellLine(q.b)); });
    });
    return out;
  }

  var KEY = 'apple-crates.v1', REWARD_STEP = 6, REWARD_GOALS = 4;
  var app = document.getElementById('app');
  var st = load();
  var lastSay = '', voiceOn = true, screen = 0, keyHandler = null;

  function load() { try { var s = JSON.parse(localStorage.getItem(KEY)); if (s && s.lv) return s; } catch (e) {} return { lv: {} }; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  function E(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function B(cls, text, fn) { var b = E('button', cls, text); b.type = 'button'; if (fn) b.onclick = fn; return b; }

  function L(i) { return st.lv[i] || (st.lv[i] = {}); }
  function totalStars() { var n = 0; LEVELS.forEach(function (x, i) { n += (st.lv[i] && st.lv[i].stars) || 0; }); return n; }
  function drawStars() { document.getElementById('starTotal').textContent = '⭐ ' + totalStars(); }
  function unlocked(i) { return i === 0 || (st.lv[i - 1] && st.lv[i - 1].stars != null); }
  /* Rewards: the child types one for every 6 stars. A child's own words stay on this device: the tmg. name keeps them out of the account sync. */

  document.getElementById('snd').onclick = function () { var v = voiceOn; voiceOn = true; say(lastSay); voiceOn = v; };
  document.getElementById('mute').onclick = function () { voiceOn = !voiceOn; this.textContent = voiceOn ? '🗣️' : '🔇'; this.setAttribute('aria-label', voiceOn ? 'Turn the voice off' : 'Turn the voice on'); if (!voiceOn) hush(); };
  var ctx = null;
  function plop(f, len) {

  /* ---------- the number keys: they answer the moment a finger touches them ---------- */
  function askNum(parent, opts) {
    var line = E('div', 'big'), blank = E('u', null, ' '), val = '', locked = false, badTimer = 0, showingBad = false, want = String(opts.answer), wrong = 0;
