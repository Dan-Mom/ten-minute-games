<title>iPad 声音测试</title>
<style>
/* one column of four big test buttons, read on an iPad */
:root{--bg:#f6f4ee;--card:#ffffff;--ink:#1f2a3d;--mute:#5d6678;--accent:#c2410c;--line:#e3ddcf;--ok:#1f8f45}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#17191f;--card:#21252e;--ink:#eef0f4;--mute:#a8afbd;--accent:#ff8a4c;--line:#353b47;--ok:#5fd38a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17191f;--card:#21252e;--ink:#eef0f4;--mute:#a8afbd;--accent:#ff8a4c;--line:#353b47;--ok:#5fd38a;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
main{max-width:620px;margin:0 auto;display:grid;gap:16px}
h1{font-size:26px;margin:0;text-wrap:balance}
p{margin:0;color:var(--mute)}
.line{font-size:22px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.tests{display:grid;gap:12px}
button{display:flex;gap:14px;align-items:center;text-align:left;width:100%;min-height:72px;border:2px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);font:inherit;padding:12px 16px;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button .n{flex:0 0 auto;width:48px;height:48px;border-radius:12px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}
button .t{display:grid;min-width:0}
button b{font-size:19px}
button small{color:var(--mute);font-size:14px}
button.played{border-color:var(--ok)}
.note{font-size:15px}
</style>
</head>
<body>
<main>
  <h1>iPad 声音测试</h1>
  <p>请在 iPad 上，把下面 4 个按钮一个一个点一下，每个都听完。然后告诉我：哪几个有杂音、发抖，哪几个干净。</p>
  <div class="line">因为太阳天天照着它们。不晒太阳，苹果不红。</div>
  <div class="tests">
    <button type="button" id="t1"><span class="n">1</span><span class="t"><b>方式 1：现在游戏里的方式</b><small>Web Audio，打开页面时就准备好</small></span></button>
    <button type="button" id="t2"><span class="n">2</span><span class="t"><b>方式 2：以前的方式</b><small>普通音频播放器</small></span></button>
    <button type="button" id="t3"><span class="n">3</span><span class="t"><b>方式 3：点了以后才准备</b><small>Web Audio，第一次点按钮时才准备</small></span></button>
    <button type="button" id="t4"><span class="n">4</span><span class="t"><b>方式 4：换成 48kHz 的录音</b><small>和方式 1 一样，但录音先转成 iPad 的 48kHz</small></span></button>
  </div>
  <p class="note" id="info"></p>
</main>
