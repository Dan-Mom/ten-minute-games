<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="tmg-home" content="1">
<script>/* Ten-Minute Games accounts: a parent signs in with Google, adds children by nickname, and each child's game progress follows them
   to any computer or iPad. Signing in is optional; without it every game works exactly as before (progress stays on this device).

   How progress is kept: every game already saves its progress in this browser (localStorage) under its own names. This script,
   which build.cjs puts at the very top of every page, keeps one copy of those values per player ("guest" = not signed in, or a
   child). When the player changes, the values in the browser are swapped before the game reads them. When a child is playing,
   their copy is also saved to Firebase (Firestore: families/<parent uid>/kids/<child id>), and loaded back on other devices.
   Only values written by these game pages are kept; nothing else in the browser is read or sent.

   Public Firebase web config: allowed on the public site by PRIVACY-RULE.md exception five. Access is guarded by the Firestore
   rules (each parent can only read and write their own family), not by hiding this. */
(function () {
  'use strict';
  if (window.TMG) return;
  var CONFIG = {
    apiKey: 'AIzaSyDC-kbJIExCfhIsUkkShVIO8VtBTe3D7WI',
    authDomain: 'ten-minute-games.firebaseapp.com',
    projectId: 'ten-minute-games',
    storageBucket: 'ten-minute-games.firebasestorage.app',
    messagingSenderId: '448551703283',
    appId: '1:448551703283:web:7f0c2b75a166f1fcbb1d86'
  };
  var SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
  var P = 'tmg.', GUEST = 'guest', MAX_VALUE = 200000;
  var LS; try { LS = window.localStorage; LS.getItem(P + 'x'); } catch (e) { LS = null; }
  if (!LS) { window.TMG = { kid: GUEST, ready: Promise.resolve(), mountHome: function () {} }; return; }
  var rawSet = Storage.prototype.setItem, rawRemove = Storage.prototype.removeItem, rawGet = Storage.prototype.getItem;
  function get(k) { return rawGet.call(LS, k); }
  function put(k, v) { try { rawSet.call(LS, k, v); } catch (e) {} }
  function del(k) { rawRemove.call(LS, k); }
  function J(k, d) { try { var v = get(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function W(k, o) { put(k, JSON.stringify(o)); }
  function ours(k) { return typeof k === 'string' && (k.indexOf(P) === 0 || k.indexOf('firebase') === 0); }

  function current() { return get(P + 'current') || GUEST; }
  function store(id) { return J(P + 'kid.' + id, { data: {}, updated: 0 }); }
  function saveStore(id, s) { W(P + 'kid.' + id, s); }
  function known() { return J(P + 'known', []); }

  /* Put player `id`'s values into the browser. The values sitting there now belong to `owner`: keep them first. */
  function swap() {
    var id = current(), owner = get(P + 'owner') || GUEST;
    if (owner === id) return false;
    var ks = known(), from = store(owner), to = store(id), changed = false;
    ks.forEach(function (k) { var v = get(k); if (v === null) delete from.data[k]; else from.data[k] = v; });
    saveStore(owner, from);
    ks.forEach(function (k) {
      var want = Object.prototype.hasOwnProperty.call(to.data, k) ? to.data[k] : null;
      if (get(k) !== want) { changed = true; if (want === null) del(k); else put(k, want); }
    });
    put(P + 'owner', id);
    return changed;
  }
  swap();

  /* Every write a game makes is copied into the current player's store (and marked for upload when a child is playing). */
  var dirtyTimer = 0;
  function noteWrite(k, v) {
    if (ours(k)) return;
    if (v !== null && String(v).length > MAX_VALUE) return;
    var ks = known(); if (ks.indexOf(k) < 0) { ks.push(k); W(P + 'known', ks); }
    var id = current(), s = store(id);
    if (v === null) delete s.data[k]; else s.data[k] = String(v);
    s.updated = Date.now(); saveStore(id, s);
    if (id !== GUEST) { put(P + 'dirty', '1'); clearTimeout(dirtyTimer); dirtyTimer = setTimeout(function () { cloud.push(); }, 3000); }
  }
  Storage.prototype.setItem = function (k, v) { rawSet.call(this, k, v); if (this === LS) noteWrite(String(k), String(v)); };
  Storage.prototype.removeItem = function (k) { rawRemove.call(this, k); if (this === LS) noteWrite(String(k), null); };

  /* ---------- Firebase (loaded only when it is needed) ---------- */
  var fb = null;
  function loadScript(src) { return new Promise(function (ok, no) { var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }
  function firebaseReady() {
    if (fb) return fb;
    fb = loadScript(SDK + 'firebase-app-compat.js')
      .then(function () { return Promise.all([loadScript(SDK + 'firebase-auth-compat.js'), loadScript(SDK + 'firebase-firestore-compat.js')]); })
      .then(function () {
        var app = window.firebase.apps.length ? window.firebase.app() : window.firebase.initializeApp(CONFIG);
        return { auth: app.auth(), db: app.firestore() };
      });
    return fb;
  }
  function userNow(f) { return new Promise(function (ok) { var off = f.auth.onAuthStateChanged(function (u) { off(); ok(u); }); }); }
  function kidsRef(f, uid) { return f.db.collection('families').doc(uid).collection('kids'); }

  var cloud = {
    /* upload the current child's copy */
    push: function () {
      var id = current(), uid = get(P + 'uid');
      if (id === GUEST || !uid || get(P + 'dirty') !== '1') return Promise.resolve();
      var s = store(id), name = (J(P + 'family', { kids: [] }).kids.filter(function (k) { return k.id === id; })[0] || {}).name || 'Player';
      if (JSON.stringify(s.data).length > 900000) return Promise.resolve();   // a Firestore document holds at most 1 MB: keep it on this device only
      return firebaseReady().then(function (f) {
        return kidsRef(f, uid).doc(id).set({ name: name, data: s.data, updated: s.updated || Date.now() });
      }).then(function () { if (store(id).updated === s.updated) del(P + 'dirty'); }, function () {});
    },
    /* download the current child's copy if the cloud has a newer one; returns true when the browser's values changed */
    pull: function () {
      var id = current(), uid = get(P + 'uid');
      if (id === GUEST || !uid) return Promise.resolve(false);
      return firebaseReady().then(function (f) { return kidsRef(f, uid).doc(id).get(); }).then(function (doc) {
        if (!doc.exists) return false;
        var c = doc.data(), s = store(id);
        if ((c.updated || 0) <= (s.updated || 0)) { if ((s.updated || 0) > (c.updated || 0)) { put(P + 'dirty', '1'); cloud.push(); } return false; }
        saveStore(id, { data: c.data || {}, updated: c.updated });
        var ks = known(); Object.keys(c.data || {}).forEach(function (k) { if (ks.indexOf(k) < 0) ks.push(k); }); W(P + 'known', ks);
        var changed = false;
        if ((get(P + 'owner') || GUEST) === id) ks.forEach(function (k) {
          var want = Object.prototype.hasOwnProperty.call(c.data || {}, k) ? c.data[k] : null;
          if (get(k) !== want) { changed = true; if (want === null) del(k); else put(k, want); }
        });
        return changed;
      }, function () { return false; });
    }
  };
  window.addEventListener('pagehide', function () { cloud.push(); });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') cloud.push(); });

  /* On a game page with a child playing: fetch their newest progress; if it differs from what the game already read, reload once. */
  var onHome = !!document.querySelector('meta[name="tmg-home"]');
  var ready = Promise.resolve();
  if (get(P + 'uid') && current() !== GUEST) {
    ready = cloud.pull().then(function (changed) {
      if (changed && !onHome) {
        var flag = 'tmg.reloaded.' + location.pathname;
        try { if (!sessionStorage.getItem(flag)) { sessionStorage.setItem(flag, '1'); location.reload(); } } catch (e) {}
      }
    });
  }

  /* ---------- the parent panel on the home page ---------- */
  function E(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function newId() { var a = new Uint8Array(9); crypto.getRandomValues(a); return Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join(''); }
  function cleanName(s) { return String(s || '').replace(/[<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, 20); }

  function mountHome(box) {
    var msg = '';
    function render() {
      box.replaceChildren();
      var uid = get(P + 'uid'), fam = J(P + 'family', { kids: [] }), cur = current();
      if (!uid) {
        var b = E('button', 'acct-btn', 'Parent sign-in'); b.type = 'button'; b.onclick = signIn;
        box.appendChild(b);
        box.appendChild(E('span', 'acct-note', 'Optional: keep each child’s progress on every device.'));
      } else {
        var row = E('div', 'acct-kids');
        fam.kids.forEach(function (k) {
          var chip = E('button', 'acct-kid' + (k.id === cur ? ' on' : ''), (k.id === cur ? '▶ ' : '') + k.name); chip.type = 'button';
          chip.setAttribute('aria-pressed', k.id === cur ? 'true' : 'false');
          chip.onclick = function () { choose(k.id); };
          row.appendChild(chip);
        });
        var g = E('button', 'acct-kid' + (cur === GUEST ? ' on' : ''), 'Just looking'); g.type = 'button'; g.onclick = function () { choose(GUEST); };
        row.appendChild(g);
        var add = E('button', 'acct-btn small', '+ Add child'); add.type = 'button'; add.onclick = addKid;
        row.appendChild(add);
        box.appendChild(row);
        var tools = E('span', 'acct-tools');   // on the same row, right after "+ Add child"
        var so = E('button', 'acct-link', 'Sign out'); so.type = 'button'; so.onclick = signOut; tools.appendChild(so);
        var rm = E('button', 'acct-link', 'Remove a child'); rm.type = 'button'; rm.onclick = removeKid; tools.appendChild(rm);
        var dl = E('button', 'acct-link danger', 'Delete account and all data'); dl.type = 'button'; dl.onclick = deleteAll; tools.appendChild(dl);
        var pv = E('a', 'acct-link', 'Privacy'); pv.href = 'privacy.html'; tools.appendChild(pv);
        row.appendChild(tools);
      }
      if (msg) box.appendChild(E('div', 'acct-msg', msg));
    }
    function say(t) { msg = t; render(); }
    function loadFamily(f, uid) {
      return kidsRef(f, uid).get().then(function (q) {
        var kids = []; q.forEach(function (d) { kids.push({ id: d.id, name: cleanName(d.data().name) || 'Player' }); });
        kids.sort(function (a, b) { return a.name.localeCompare(b.name); });
        W(P + 'family', { kids: kids });
        if (current() !== GUEST && !kids.some(function (k) { return k.id === current(); })) { put(P + 'current', GUEST); swap(); }
        return kids;
      });
    }
    function signIn() {
      say('Opening Google sign-in…');
      firebaseReady().then(function (f) {
        var p = new window.firebase.auth.GoogleAuthProvider();
        return f.auth.signInWithPopup(p).then(function (r) { put(P + 'uid', r.user.uid); return loadFamily(f, r.user.uid); });
      }).then(function (kids) { msg = kids.length ? 'Signed in. Pick who is playing.' : 'Signed in. Add your first child (a nickname is enough).'; render(); },
        function (e) { say(e && e.code === 'auth/popup-closed-by-user' ? '' : 'Sign-in did not work' + (e && e.code ? ' (' + e.code + ')' : '') + '. Please try again.'); });
    }
    function addKid() {
      var name = cleanName(window.prompt('Child’s nickname (not their full name):', ''));
      if (!name) return;
      var uid = get(P + 'uid'), id = newId(), fam = J(P + 'family', { kids: [] });
      var guest = store(GUEST), first = fam.kids.length === 0 && Object.keys(guest.data).length > 0;
      var start = { data: {}, updated: Date.now() };
      if (first && window.confirm('Move the progress already on this device to ' + name + '?')) {
        swap(); start = { data: JSON.parse(JSON.stringify(store(GUEST).data)), updated: Date.now() };
      }
      say('Adding ' + name + '…');
      firebaseReady().then(function (f) {
        return kidsRef(f, uid).doc(id).set({ name: name, data: start.data, updated: start.updated }).then(function () { return loadFamily(f, uid); });
      }).then(function () { saveStore(id, start); choose(id); }, function () { say('Could not add ' + name + '. Please try again.'); });
    }
    function choose(id) {
      cloud.push().then(function () {
        put(P + 'current', id); swap();
        msg = id === GUEST ? 'Just looking: progress stays on this device.' : 'Now playing: ' + ((J(P + 'family', { kids: [] }).kids.filter(function (k) { return k.id === id; })[0] || {}).name || '');
        render();
        return cloud.pull();
      });
    }
    function removeKid() {
      var fam = J(P + 'family', { kids: [] }); if (!fam.kids.length) return;
      var name = window.prompt('Type the nickname of the child to remove. Their progress is deleted everywhere.\n\n' + fam.kids.map(function (k) { return k.name; }).join(', '), '');
      var k = fam.kids.filter(function (x) { return x.name === cleanName(name); })[0]; if (!k) return;
      var uid = get(P + 'uid');
      firebaseReady().then(function (f) { return kidsRef(f, uid).doc(k.id).delete().then(function () { return loadFamily(f, uid); }); })
        .then(function () { del(P + 'kid.' + k.id); say(k.name + ' was removed.'); }, function () { say('Could not remove ' + k.name + '. Please try again.'); });
    }
    /* leave this device as a guest device: the children's copies are taken off it */
    function forgetDevice() {
      put(P + 'current', GUEST); swap();
      J(P + 'family', { kids: [] }).kids.forEach(function (k) { del(P + 'kid.' + k.id); });
      del(P + 'family'); del(P + 'uid'); del(P + 'dirty');
    }
    function signOut() {
      cloud.push().then(firebaseReady).then(function (f) { return f.auth.signOut(); }).then(function () { forgetDevice(); say('Signed out. This device is back to guest play.'); },
        function () { forgetDevice(); say('Signed out on this device.'); });
    }
    function deleteAll() {
      if (!window.confirm('Delete your account, all your children and all their progress? This cannot be undone.')) return;
      var uid = get(P + 'uid');
      say('Deleting…');
      firebaseReady().then(function (f) {
        return kidsRef(f, uid).get().then(function (q) { var jobs = []; q.forEach(function (d) { jobs.push(d.ref.delete()); }); return Promise.all(jobs); })
          .then(function () { var u = f.auth.currentUser; return u.delete().catch(function (e) {
            if (e && e.code === 'auth/requires-recent-login') return u.reauthenticateWithPopup(new window.firebase.auth.GoogleAuthProvider()).then(function () { return u.delete(); });
            throw e; }); });
      }).then(function () { forgetDevice(); say('Your account and all its data were deleted.'); },
        function () { say('Could not finish deleting. Please sign in again and retry.'); });
    }
    /* check the sign-in is still valid (it can end on another device) */
    if (get(P + 'uid')) firebaseReady().then(function (f) { return userNow(f).then(function (u) {
      if (!u) { forgetDevice(); render(); return; }
      return loadFamily(f, u.uid).then(render);
    }); }, function () {});
    render();
  }

  window.TMG = { kid: current(), ready: ready, mountHome: mountHome, _swap: swap, _cloud: cloud };
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ten-Minute Games</title>
<meta name="description" content="Learning games for curious kids. Each game teaches one idea in about ten minutes a level.">
<meta name="theme-color" content="#7ccbff">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20viewBox%3D%220%200%2064%2064%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20role%3D%22img%22%20aria-label%3D%22Ten-Minute%20Games%22%3E%3Crect%20x%3D%2228%22%20y%3D%221.5%22%20width%3D%228%22%20height%3D%226%22%20rx%3D%222%22%20fill%3D%22%231d2b4f%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2236%22%20r%3D%2224%22%20fill%3D%22%23ffffff%22%20stroke%3D%22%231d2b4f%22%20stroke-width%3D%226%22%2F%3E%3Cpath%20d%3D%22M32%2036%20L32%2015%20A21%2021%200%200%201%2050.2%2025.5%20Z%22%20fill%3D%22%23e8650a%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2236%22%20r%3D%224%22%20fill%3D%22%231d2b4f%22%2F%3E%3Cpath%20d%3D%22M54%203%20L55.8%207.6%20L60.4%209.4%20L55.8%2011.2%20L54%2015.8%20L52.2%2011.2%20L47.6%209.4%20L52.2%207.6%20Z%22%20fill%3D%22%23ffd23f%22%20stroke%3D%22%231d2b4f%22%20stroke-width%3D%221.4%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E">

<style>
:root{
  color-scheme:light;
  --ink:#1d2b4f; --mute:#4a587a; --page:#fff6e3; --card:#fff;
  --orange:#d95b00; --orange-s:#ffe2c4; --orange-m:#ff9a3d;
  --pink:#d6246e;   --pink-s:#ffd8ea;   --pink-m:#ff6fa8;
  --teal:#0b8a7c;   --teal-s:#c8f3ec;   --teal-m:#2fd0bd;
  --green:#1f8f45;  --green-s:#d3f4dd;  --green-m:#4fd37c;
  --purple:#6d3fd8; --purple-s:#e4dbff; --purple-m:#a07cff;
  --blue:#1b6fd1;   --blue-s:#d5e9ff;   --blue-m:#4fa8ff;
  --display:"Baloo 2","Nunito","Trebuchet MS","Segoe UI Rounded",ui-rounded,system-ui,sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--page);color:var(--ink);font:700 18px/1.55 var(--body);overflow-x:hidden}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1}
.c-orange{--c:var(--orange);--cs:var(--orange-s);--cm:var(--orange-m)}
.c-pink{--c:var(--pink);--cs:var(--pink-s);--cm:var(--pink-m)}
.c-teal{--c:var(--teal);--cs:var(--teal-s);--cm:var(--teal-m)}
.c-green{--c:var(--green);--cs:var(--green-s);--cm:var(--green-m)}
.c-purple{--c:var(--purple);--cs:var(--purple-s);--cm:var(--purple-m)}
.c-blue{--c:var(--blue);--cs:var(--blue-s);--cm:var(--blue-m)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:rgba(255,246,227,.94);backdrop-filter:blur(6px);border-bottom:2px solid #f1dfb8}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:62px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:800 22px var(--display)}
.brand svg{width:44px;height:44px}

/* hero */
.hero{position:relative;background:linear-gradient(180deg,#7ccbff 0%,#b9e6ff 60%,#fff0c9 100%);padding:34px 0 70px;overflow:hidden}
.hero.bare{padding:0;height:14px}
.hero h1{font-size:clamp(26px,4.2vw,44px);font-weight:800;color:#fff;text-shadow:0 4px 0 #1b6fd1,0 8px 0 rgba(27,111,209,.3);max-width:760px}
.hero .sub{margin:14px 0 0;font:700 clamp(17px,2.2vw,21px)/1.45 var(--body);color:#12306b;max-width:620px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.chip{background:rgba(255,255,255,.92);color:#12306b;border-radius:999px;padding:5px 14px;font:800 15px var(--display)}

/* category tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:14px;margin-top:14px;position:relative}
.tile{position:relative;display:flex;flex-direction:column;gap:4px;text-decoration:none;color:#fff;border-radius:24px;padding:16px;min-height:150px;background:linear-gradient(150deg,var(--cm),var(--c));box-shadow:0 7px 0 rgba(20,30,60,.22),0 16px 26px rgba(20,30,60,.1);overflow:hidden;transition:transform .15s}
.tile:hover{transform:translateY(-4px) rotate(-.5deg)}
.tile::before{content:"";position:absolute;right:-34px;top:-34px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.16)}
.tile .e{font-size:48px;line-height:1;filter:drop-shadow(0 5px 0 rgba(0,0,0,.18))}
.tile h3{font-size:21px;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.tile span.n{font:800 14px var(--display);opacity:.95}

/* category sections and game cards */
section.cat{padding:38px 0 6px}
.cat-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cat-head .e{font-size:42px;line-height:1}
.cat-head h2{font-size:clamp(26px,3.8vw,36px);font-weight:800;color:var(--c)}
.lead{margin:4px 0 18px;color:var(--mute);font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:18px}
.card{display:flex;flex-direction:column;text-decoration:none;color:inherit;background:var(--card);border:3px solid var(--cs);border-radius:24px;overflow:hidden;box-shadow:0 6px 0 var(--cs),0 12px 22px rgba(20,30,60,.08);transition:transform .15s}
.card:hover{transform:translateY(-4px)}
.card .art{height:104px;display:flex;align-items:center;justify-content:center;background:linear-gradient(150deg,var(--cs),#fff 140%);font-size:56px}
.card .body{padding:12px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:21px}
.card p{margin:0;font-size:16px;color:var(--mute);line-height:1.45}
.card .play{margin-top:auto;align-self:flex-start;background:var(--c);color:#fff;border-radius:14px;padding:6px 18px;font:800 18px var(--display);box-shadow:0 4px 0 rgba(0,0,0,.22)}
.card small{color:var(--mute);font-size:14px}

/* about and footer */
.about{margin:44px auto 0;background:#fff;border-radius:24px;padding:22px;box-shadow:0 6px 0 #f1dfb8}
.about h2{font-size:26px}
.about p{margin:8px 0 0;color:var(--mute)}
footer{padding:26px 0 40px;color:var(--mute);font-size:15px;text-align:center}

/* "a newer version is ready" banner */

<script>
var DATA = {"v":1793576466204,"site":{"title":"Ten-Minute Games","tagline":"","sub":"","categories":[{"id":"math","name":"Math","emoji":"🧮","color":"orange","blurb":"Games for numbers, Roman numerals and times tables."},{"id":"chinese","name":"Chinese 中文","emoji":"🏮","color":"blue","blurb":"Chinese characters, one lesson at a time: meet them, build words, use them in sentences."},{"id":"science","name":"Science and the World","emoji":"🔬","color":"green","blurb":"The human body, history mysteries and our planet."},{"id":"food","name":"Food and Health Detectives","emoji":"🕵️","color":"pink","blurb":"Reading labels and spotting what packages really say."},{"id":"steam","name":"Little STEAM Lab","emoji":"🧊","color":"purple","blurb":"Puzzles and things to build with your hands."},{"id":"money","name":"Money Smarts","emoji":"🐷","color":"teal","blurb":"Saving, interest and how money grows."}],"promises":[],"about":{"title":"Made for two kids first, then shared with yours","text":"We make these games at home for our own two curious kids, building them with AI and testing them together as we go. Now we are sharing them with yours."},"disclaimer":"For learning at home. Signing in is optional: we keep only a parent’s sign-in, the nicknames they type and the game progress."},"games":[{"id":"make-ten-express","category":"math","title":"Make Ten Express","emoji":"🚂","blurb":"Every train car holds 10. Fill the car first, then add or take away: 8 + 5 = 10 + 3. Five levels, about ten minutes each.","note":"","href":"games/make-ten/index.html?home=..%2F..%2Findex.html"},{"id":"roman-numerals","category":"math","title":"Roman Numeral Kingdom","emoji":"🏰","blurb":"A kingdom-building game that trains Roman numerals after your child has met tens and ones. Explore, build and unlock, with short gentle checkpoints.","note":"","href":"games/roman/index.html?home=..%2F..%2Findex.html"},{"id":"times-tables","category":"math","title":"Times Tables Challenge","emoji":"✖️","blurb":"Practice the m gertip. A short tour of how skin renews itself and how the body's guards help. Includes narrated video.","note":"","href":"sci/splinter/Splinter.html?home=..%2F..%2Findex.html"},{"id":"sugar-label-detective","category":"food","title":"The Sugar Detective","emoji":"🍬","blurb":"Is the sweetest food the one with the most sugar? Kids learn to read the nutrition label instead of trusting taste or words like \"natural\".","note":"","href":"sci/sugar-label-detective.html?home=..%2Findex.html"},{"id":"fat-label-detective","category":"food","title":"The Fat Detective","emoji":"🥑","blurb":"Not all fat is the same. Kids sort \"friendlier\" fats from \"go-easy\" fats and learn what the fat lines on a label really tell you.","note":"","href":"sci/fat-label-detective.html?home=..%2Findex.html"},{"id":"color-label-detective","category":"food","title":"The Color Detective","emoji":"🫐","blurb":"Why is a \"blue raspberry\" popsicle blue? Kids find the colour on the ingredient list and learn what the dye names mean.","note":"","href":"sci/color-label-detective.html?home=..%2Findex.html"},{"id":"warning-label-detective","category":"food","title":"The Warning Label Detective","emoji":"⚠️","blurb":"What does a California \"cancer warning\" sticker really mean? A calm look at why the label exists: it is a required notice about tiny trace amounts, not a sign the food is poison.","note":"","href":"sci/warning-label-detective.html?home=..%2Findex.html"},{"id":"package-claims-detective","category":"food","title":"The Package Claims Detective","emoji":"📦","blurb":"\"Tree ripened\", \"sun-dried\", \"natural\": what does a package claim actually promise? Kids practice telling a claim from a fact. Includes a narrated video and two parts, Starter and Stretch.","note":"The explainer film loads when you press play.","href":"sci/package-claims-detective.html?home=..%2Findex.html"},{"id":"cube","category":"steam","title":"Little Cube Quest","emoji":"🧊","blurb":"Twenty guided lessons on the screen and var S = DATA.site, G = DATA.games;
function E(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

if (S.sub) document.getElementById('sub').textContent = S.sub; else document.getElementById('sub').remove();
(S.promises || []).forEach(function (t) { document.getElementById('chips').appendChild(E('span', 'chip', t)); });

var tiles = document.getElementById('tiles'), cats = document.getElementById('cats');
S.categories.forEach(function (c) {

  var s = E('section', 'cat c-' + c.color); s.id = c.id;

  s.appendChild(E('p', 'lead', c.blurb));
  var grid = E('div', 'grid');
  list.forEach(function (g) {
    var a = E('a', 'card'); a.href = g.href;
    a.appendChild(E('div', 'art', g.emoji));
    var b = E('div', 'body'); b.appendChild(E('h3', null, g.title)); b.appendChild(E('p', null, g.blurb));
    if (g.note) b.appendChild(E('small', null, g.note));
    b.appendChild(E('span', 'play', 'Play ▶'));
    a.appendChild(b); grid.appendChild(a);
  });
  s.appendChild(grid); cats.appendChild(s);
});

if (S.about) { ab.appendChild(E('h2', null, S.about.title)); ab.appendChild(E('p', null, S.about.text)); } else ab.remove();
var ft = document.getElementById('foot'); ft.textContent = (S.disclaimer || '') + ' '; var pl = E('a', null, 'Privacy'); pl.href = 'privacy.html'; ft.appendChild(pl);

/* a newer build only shows a small banner; nothing reloads by itself */
(function () {
  var bar = document.getElementById('upd');
  function look() {
    if (!window.fetch || location.protocol === 'file:') return;
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); })
      .then(function (j) { if (j && Number(j.v) > Number(DATA.v)) bar.hidden = false; }, function () {});
  }
  document.getElementById('updBtn').onclick = function () { location.reload(); };
  look();
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') look(); });
})();
</script>
