<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ten-Minute Games: one idea per game, ten minutes a level</title>
<meta name="description" content="Free learning games for curious kids. Each game teaches one idea in about ten minutes a level. No sign-up, nothing collected.">
<meta name="theme-color" content="#7ccbff">

<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ten-Minute Games">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --ink:#1d2b4f; --mute:#4a587a; --page:#fff6e3; --card:#fff;
  --orange:#d95b00; --orange-s:#ffe2c4; --orange-m:#ff9a3d;
  --pink:#d6246e;   --pink-s:#ffd8ea;   --pink-m:#ff6fa8;
  --teal:#0b8a7c;   --teal-s:#c8f3ec;   --teal-m:#2fd0bd;
  --green:#1f8f45;  --green-s:#d3f4dd;  --green-m:#4fd37c;
  --purple:#6d3fd8; --purple-s:#e4dbff; --purple-m:#a07cff;
  --blue:#1b6fd1;   --blue-s:#d5e9ff;   --blue-m:#4fa8ff;
  --display:"Baloo 2","Nunito","Trebuchet MS","Segoe UI Rounded",ui-rounded,system-ui,sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--page);color:var(--ink);font:700 18px/1.55 var(--body);overflow-x:hidden}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1}
.c-orange{--c:var(--orange);--cs:var(--orange-s);--cm:var(--orange-m)}
.c-pink{--c:var(--pink);--cs:var(--pink-s);--cm:var(--pink-m)}
.c-teal{--c:var(--teal);--cs:var(--teal-s);--cm:var(--teal-m)}
.c-green{--c:var(--green);--cs:var(--green-s);--cm:var(--green-m)}
.c-purple{--c:var(--purple);--cs:var(--purple-s);--cm:var(--purple-m)}
.c-blue{--c:var(--blue);--cs:var(--blue-s);--cm:var(--blue-m)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:rgba(255,246,227,.94);backdrop-filter:blur(6px);border-bottom:2px solid #f1dfb8}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:62px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:800 22px var(--display)}
.brand svg{width:44px;height:44px}

/* hero */
.hero{position:relative;background:linear-gradient(180deg,#7ccbff 0%,#b9e6ff 60%,#fff0c9 100%);padding:34px 0 70px;overflow:hidden}
.hero h1{font-size:clamp(32px,5.4vw,56px);font-weight:800;color:#fff;text-shadow:0 4px 0 #1b6fd1,0 8px 0 rgba(27,111,209,.3);max-width:760px}
.hero .sub{margin:14px 0 0;font:700 clamp(17px,2.2vw,21px)/1.45 var(--body);color:#12306b;max-width:620px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.chip{background:rgba(255,255,255,.92);color:#12306b;border-radius:999px;padding:5px 14px;font:800 15px var(--display)}

/* category tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:14px;margin-top:-44px;position:relative}
.tile{position:relative;display:flex;flex-direction:column;gap:4px;text-decoration:none;color:#fff;border-radius:24px;padding:16px;min-height:150px;background:linear-gradient(150deg,var(--cm),var(--c));box-shadow:0 7px 0 rgba(20,30,60,.22),0 16px 26px rgba(20,30,60,.1);overflow:hidden;transition:transform .15s}
.tile:hover{transform:translateY(-4px) rotate(-.5deg)}
.tile::before{content:"";position:absolute;right:-34px;top:-34px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.16)}
.tile .e{font-size:48px;line-height:1;filter:drop-shadow(0 5px 0 rgba(0,0,0,.18))}
.tile h3{font-size:21px;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.tile span.n{font:800 14px var(--display);opacity:.95}

/* category sections and game cards */
section.cat{padding:38px 0 6px}
.cat-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cat-head .e{font-size:42px;line-height:1}
.cat-head h2{font-size:clamp(26px,3.8vw,36px);font-weight:800;color:var(--c)}
.lead{margin:4px 0 18px;color:var(--mute);font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:18px}
.card{display:flex;flex-direction:column;text-decoration:none;color:inherit;background:var(--card);border:3px solid var(--cs);border-radius:24px;overflow:hidden;box-shadow:0 6px 0 var(--cs),0 12px 22px rgba(20,30,60,.08);transition:transform .15s}
.card:hover{transform:translateY(-4px)}
.card .art{height:104px;display:flex;align-items:center;justify-content:center;background:linear-gradient(150deg,var(--cs),#fff 140%);font-size:56px}
.card .body{padding:12px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:21px}
.card p{margin:0;font-size:16px;color:var(--mute);line-height:1.45}
.card .play{margin-top:auto;align-self:flex-start;background:var(--c);color:#fff;border-radius:14px;padding:6px 18px;font:800 18px var(--display);box-shadow:0 4px 0 rgba(0,0,0,.22)}
.card small{color:var(--mute);font-size:14px}

/* about and footer */
.about{margin:44px auto 0;background:#fff;border-radius:24px;padding:22px;box-shadow:0 6px 0 #f1dfb8}
.about h2{font-size:26px}
.about p{margin:8px 0 0;color:var(--mute)}
footer{padding:26px 0 40px;color:var(--mute);font-size:15px;text-align:center}

/* "a newer version is ready" banner */
#upd{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:12px;background:#12306b;color:#fff;border-radius:999px;padding:8px 10px 8px 18px;box-shadow:0 8px 24px rgba(0,0,0,.25);font:800 16px var(--display);max-width:calc(100% - 32px)}
#upd[hidden]{display:none}
#upd button{border:0;border-radius:999px;background:#ffd23f;color:#5a3d00;font:800 16px var(--display);padding:8px 16px;cursor:pointer;min-height:40px}
</style>
</head>
<body>
<header class="top"><div class="wrap"><a class="brand" href="#top"><span id="logo"><svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ten-Minute Games"><rect x="28" y="1.5" width="8" height="6" rx="2" fill="#1d2b4f"/><circle cx="32" cy="36" r="24" fill="#ffffff" stroke="#1d2b4f" stroke-width="6"/><path d="M32 36 L32 15 A21 21 0 0 1 50.2 25.5 Z" fill="#e8650a"/><circle cx="32" cy="36" r="4" fill="#1d2b4f"/><path d="M54 3 L55.8 7.6 L60.4 9.4 L55.8 11.2 L54 15.8 L52.2 11.2 L47.6 9.4 L52.2 7.6 Z" fill="#ffd23f" stroke="#1d2b4f" stroke-width="1.4" stroke-linejoin="round"/></svg></span><span>Ten-Minute Games</span></a></div></header>
<main id="top">
  <div class="hero"><div class="wrap"><h1 id="tagline"></h1><p class="sub" id="sub"></p><div class="chips" id="chips"></div></div></div>
  <div class="wrap"><nav class="tiles" id="tiles" aria-label="Game corners"></nav><div id="cats"></div><div class="about" id="about"></div></div>
</main>
<footer><div class="wrap" id="foot"></div></footer>
<div id="upd" hidden role="status"><span>New games are ready</span><button type="button" id="updBtn">Refresh</button></div>
<script>
var DATA = {"v":1793559982403,"site":{"title":"Ten-Minute Games","tagline":"One idea per game. Ten minutes a level.","sub":"Free learning games for curious kids: math, science, food smarts and money. Each game teaches one idea; bigger ideas come in levels of about ten minutes each. No sign-up, nothing collected.","categories":[{"id":"math","name":"Math","emoji":"🧮","color":"orange","blurb":"Games for numbers, Roman numerals and times tables."},{"id":"chinese","name":"Chinese 中文","emoji":"🏮","color":"blue","blurb":"Chinese characters, one lesson at a time: meet them, build words, use them in sentences."},{"id":"science","name":"Science and the World","emoji":"🔬","color":"green","blurb":"The human body, history mysteries and our planet."},{"id":"food","name":"Food and Health Detectives","emoji":"🕵️","color":"pink","blurb":"Reading labels and spotting what packages really say."},{"id":"steam","name":"Little STEAM Lab","emoji":"🧊","color":"purple","blurb":"Puzzles and things to build with your hands."},{"id":"money","name":"Money Smarts","emoji":"🐷","color":"teal","blurb":"Saving, interest and how money grows."}],"promises":["No accounts and no ads","Nothing about your child is collected","Free to play"],"about":{"title":"Made for two kids first, then shared with yours","text":"We make these games at home for our own two curious kids, building them with AI and testing them together as we go. Now we are sharing them with yours."},"disclaimer":"Educational use. The games are a work in progress and we welcome feedback."},"games":[{"id":"roman-numerals","category":"math","title":"Roman Numeral Kingdom","emoji":"🏰","blurb":"A kingdom-building game that trains Roman numerals after your child has met tens and ones. Explore, build and unlock, with short gentle checkpoints.","note":"","href":"games/roman/index.html?home=..%2F..%2Findex.html"},{"id":"times-tables","category":"math","title":"Times Tables Challenge","emoji":"✖️","blurb":"Practice the multiplication facts a lesson just taught: 20 rounds from the easy tables to the tricky ones. Your child chases their own best time and points, never anyone else’s. Progress stays on this device.","note":"","href":"games/multiplication/Multiplication.html?home=..%2F..%2Findex.html"},{"id":"dozen-galaxy","category":"math","title":"Dozen Galaxy","emoji":"🚀","blurb":"A space game for the 12 times table. Every cargo pod holds 10 blue and 2 pink crystals, so 12 × any number is easy to build: 10 of them plus 2 of them. Three short flights, with stars and badges for getting it right, never for being fast. Progress stays on this device.","note":"","href":"games/multiplication/dozen-galaxy.html?home=..%2F..%2Findex.html"},{"id":"mail-to-grandpa","category":"chinese","title":"Mail to Grandpa 寄信给爷爷","emoji":"✉️","blurb":"Learn 15 Chinese characters about letters and mail, then write and send a letter to Grandpa. Three levels, about ten minutes each.","note":"","href":"games/chinese/mail-to-grandpa.html?home=..%2F..%2Findex.html"},{"id":"vitamin-c","category":"science","title":"The Scurvy Mystery","emoji":"🍊","blurb":"Why did sailors get sick on long voyages, and why did fruit make them better? A true story that teaches fair testing.","note":"","href":"sci/vitamin-c.html?home=..%2Findex.html"},{"id":"tooth-timeline","category":"science","title":"The Tooth Timeline","emoji":"🦷","blurb":"Why did her first tooth fall out at 8 when friends lost theirs at 5? Kids learn the order of baby teeth and the wide range of normal.","note":"","href":"sci/tooth-timeline.html?home=..%2Findex.html"},{"id":"continents-and-oceans","category":"science","title":"The Invisible Borders of Continents and Oceans","emoji":"🌍","blurb":"Where does one continent end and an ocean begin? Kids test the rules behind the 7 continents and 4 oceans.","note":"","href":"sci/continents-and-oceans.html?home=..%2Findex.html"},{"id":"splinter","category":"science","title":"Where Did the Splinter Go?","emoji":"🪵","blurb":"A tiny splinter vanishes from a fingertip. A short tour of how skin renews itself and how the body's guards help. Includes narrated video.","note":"","href":"sci/splinter/Splinter.html?home=..%2F..%2Findex.html"},{"id":"sugar-label-detective","category":"food","title":"The Sugar Detective","emoji":"🍬","blurb":"Is the sweetest food the one with the most sugar? Kids learn to read the nutrition label instead of trusting taste or words like \"natural\".","note":"","href":"sci/sugar-label-detective.html?home=..%2Findex.html"},{"id":"fat-label-detective","category":"food","title":"The Fat Detective","emoji":"🥑","blurb":"Not all fat is the same. Kids sort \"friendlier\" fats from \"go-easy\" fats and learn what the fat lines on a label really tell you.","note":"","href":"sci/fat-label-detective.html?home=..%2Findex.html"},{"id":"color-label-detective","category":"food","title":"The Color Detective","emoji":"🫐","blurb":"Why is a \"blue raspberry\" popsicle blue? Kids find the colour on the ingredient list and learn what the dye names mean.","note":"","href":"sci/color-label-detective.html?home=..%2Findex.html"},{"id":"warning-label-detective","category":"food","title":"The Warning Label Detective","emoji":"⚠️","blurb":"What does a California \"cancer warning\" sticker really mean? A calm look at why the label exists: it is a required notice about tiny trace amounts, not a sign the food is poison.","note":"","href":"sci/warning-label-detective.html?home=..%2Findex.html"},{"id":"package-claims-detective","category":"food","title":"The Package Claims Detective","emoji":"📦","blurb":"\"Tree ripened\", \"sun-dried\", \"natural\": what does a package claim actually promise? Kids practice telling a claim from a fact. Includes a narrated video and two parts, Starter and Stretch.","note":"","href":"sci/package-claims-detective.html?home=..%2Findex.html"},{"id":"cube","category":"steam","title":"Little Cube Quest","emoji":"🧊","blurb":"Twenty guided lessons on the screen and a day-by-day plan to solve a real 2x2 and then a 3x3. Guess first, try it, check it, and learn why each move works.","note":"The voice clips load only when played.","href":"games/cube.html?home=..%2Findex.html"},{"id":"travel-piggy-bank","category":"money","title":"The Travel Piggy Bank","emoji":"🐷","blurb":"How does interest earn interest? Kids watch a travel piggy bank grow and discover compounding, with no percentages needed at first.","note":"","href":"sci/travel-piggy-bank.html?home=..%2Findex.html"}]};
